<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY RADAR | VIP</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: monospace; overflow: hidden; color: var(--neon); }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.3; }
        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .terminal { background: rgba(0,0,0,0.9); border: 1px solid var(--neon); padding: 20px; width: 90%; max-width: 500px; box-shadow: 0 0 20px var(--neon); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }
        .code-box { border: 1px solid var(--neon); margin: 5px 0; padding: 10px; background: rgba(0,255,65,0.05); }
        .alert { color: #ff3e3e; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body oncontextmenu="reportAttack(); return false;">

<canvas id="matrix"></canvas>

<div class="container">
    <div class="terminal" id="screen">
        <div style="font-size: 20px;">🛡️ SYSTEM MONITORING...</div>
        <div id="status">> CONNECTING TO DATABASE...</div>
        <div id="content"></div>
        
        <div class="stat-grid">
            <div>PING: <span id="ping">0</span>ms</div>
            <div>THREATS: <span id="threats">0</span></div>
            <div>DATA LEAK: <span style="color:white">SECURE</span></div>
            <div>UPTIME: <span id="uptime">0</span>s</div>
        </div>
    </div>
</div>

<script>
    // --- Matrix Background ---
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "0123456789ABCDEF";
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, y*14);
            if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 35);

    // --- Monitoring Logic ---
    let attacks = 0;
    let startTime = Date.now();
    const GITHUB_URL = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";

    function reportAttack() {
        attacks++;
        document.getElementById('threats').innerText = attacks;
        console.log("🚨 UNAUTHORIZED ATTEMPT LOGGED");
    }

    // كشف فتح الـ Console
    setInterval(() => {
        const threshold = 160;
        if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
            reportAttack();
        }
        document.getElementById('uptime').innerText = Math.floor((Date.now() - startTime)/1000);
    }, 1000);

    async function updateUI() {
        const pStart = performance.now();
        try {
            const res = await fetch(GITHUB_URL + "?v=" + Date.now());
            const data = await res.json();
            document.getElementById('ping').innerText = Math.floor(performance.now() - pStart);
            
            if(data.site_status === "open") {
                document.getElementById('status').innerHTML = "> <span style='color:white'>ACCESS GRANTED</span>";
                let html = "";
                data.net_codes.forEach(c => {
                    html += `<div class="code-box">${atob(c.code)} - ${c.units}U</div>`;
                });
                document.getElementById('content').innerHTML = html || "NO CODES FOUND";
            } else {
                document.getElementById('status').innerHTML = "> <span class='alert'>RESTRICTED ACCESS</span>";
                document.getElementById('content').innerHTML = "<p>يرجى التواصل مع الإدارة للتفعيل.</p>";
            }
        } catch(e) { document.getElementById('status').innerText = "> CONNECTION ERROR"; }
    }
    setInterval(updateUI, 5000); updateUI();
</script>
</body>
</html>
