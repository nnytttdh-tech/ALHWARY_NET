<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | SECURE SYSTEM</title>
    <style>
        body { background: #000; color: #ccc; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; }
        h1 { color: #ff0000; text-transform: uppercase; letter-spacing: 2px; font-size: 20px; text-shadow: 0 0 5px rgba(255,0,0,0.3); }
        .card-container { width: 100%; max-width: 450px; }
        .code-card { background: #050505; border: 1px solid #1a1a1a; margin-bottom: 12px; padding: 12px; display: flex; justify-content: space-between; position: relative; border-radius: 4px; }
        .copy-btn { border: 1px solid #ff0000; color: #ff0000; background: transparent; font-size: 10px; padding: 8px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .code-details { text-align: left; flex-grow: 1; margin-left: 15px; }
        .line { margin: 4px 0; font-weight: bold; font-size: 13px; }
        .value { color: #25d366; font-size: 16px; letter-spacing: 1px; } 
        .units-val { color: #ff0000; font-size: 14px; }
        .high-priority { background: #ff0000; color: #fff; font-size: 8px; padding: 2px 5px; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }
        #loginPage { text-align: center; margin-top: 20%; width: 100%; max-width: 380px; }
        .id-display { font-size: 32px; color: #f1c40f; margin: 20px 0; border: 2px dashed #444; padding: 20px; background: #0a0a0a; border-radius: 10px; }
        #contentPage { display: none; width: 100%; }
        .status-header { color: #444; font-size: 10px; border-bottom: 1px solid #222; width: 100%; padding-bottom: 5px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;"> <div id="loginPage">
    <h1>ALHWARY NET</h1>
    <p style="color: #444;">SECURITY STATUS: <span style="color: #ff0000;">ENCRYPTED</span></p>
    <div class="id-display" id="myID">------</div>
    <button class="copy-btn" onclick="requestAccess()" style="padding: 15px; font-size: 14px; width: 100%;">REQUEST ACCESS (WhatsApp)</button>
</div>

<div id="contentPage">
    <h1>SECURE_CARDS_V3</h1>
    <div class="status-header" id="countHeader">CONNECTED TO SECURE_SERVER</div>
    <div id="codesContainer" class="card-container"></div>
</div>

<script>
    // 1. منع اختصارات الهكرز (F12, Ctrl+U)
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    let userID = localStorage.getItem('h_user_id') || Math.floor(100000 + Math.random() * 900000).toString();
    localStorage.setItem('h_user_id', userID);
    document.getElementById('myID').innerText = userID;

    function requestAccess() {
        window.location.href = `https://wa.me/201556853817?text=ACTIVATE_MY_ID:${userID}`;
    }

    async function checkSystem() {
        try {
            const res = await fetch(`codes.json?nocache=${Date.now()}`, { cache: "no-store" });
            const data = await res.json();
            
            if (data.site_status === "open" || (data.active_users && data.active_users.includes(userID))) {
                document.getElementById('loginPage').style.display = "none";
                document.getElementById('contentPage').style.display = "block";
                
                let html = "";
                data.net_codes.forEach(item => {
                    // فك تشفير الكود المحمي عند العرض فقط
                    const originalCode = atob(item.code);
                    html += `<div class="code-card">
                        <button class="copy-btn" onclick="copyCode('${originalCode}')">COPY_CODE</button>
                        <div class="code-details">
                            <div class="high-priority">HIGH PRIORITY</div>
                            <div class="line"><span style="color:#fff">CODE:</span> <span class="value">${originalCode}</span></div>
                            <div class="line"><span style="color:#fff">UNITS:</span> <span class="units-val">${item.units}</span></div>
                        </div>
                    </div>`;
                });
                document.getElementById('codesContainer').innerHTML = html;
            }
        } catch (e) {}
    }

    function copyCode(val) {
        navigator.clipboard.writeText(val);
        alert("DONE: CODE COPIED");
    }

    setInterval(checkSystem, 1500);
</script>
</body>
</html>
