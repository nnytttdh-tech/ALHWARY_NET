<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | ULTIMATE SYSTEM</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #ccc; font-family: 'Courier New', monospace; overflow: hidden; }

        /* الخلفية المتحركة (Matrix) */
        #matrixCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* الطبقة العلوية للمحتوى */
        .main-wrapper {
            position: relative;
            z-index: 2;
            height: 100vh;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* شاشة التحميل الاحترافية */
        #loadingScreen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .loading-msg { color: #0f0; font-size: 18px; margin-bottom: 15px; font-weight: bold; text-shadow: 0 0 10px #0f0; }
        .bar-container { width: 80%; max-width: 400px; height: 12px; border: 1px solid #0f0; background: #050505; }
        .bar-fill { width: 0%; height: 100%; background: #0f0; box-shadow: 0 0 15px #0f0; transition: 0.1s; }

        /* تصميم الكروت الجديد */
        h1 { color: #ff0000; text-shadow: 0 0 15px #f00; margin-bottom: 20px; text-transform: uppercase; }
        .card-container { width: 100%; max-width: 480px; }
        .code-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #1a1a1a;
            border-top: 3px solid #ff0000;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .label { color: #888; font-size: 12px; }
        .value { color: #fff; font-weight: bold; font-size: 16px; }
        .units { color: #0f0; font-weight: bold; }
        
        .copy-btn {
            background: #ff0000; color: #fff; border: none; padding: 15px;
            width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer;
            margin-top: 15px; transition: 0.3s; text-transform: uppercase;
        }
        .copy-btn:active { transform: scale(0.95); }

        /* صفحة الدخول */
        #loginPage { text-align: center; margin-top: 30%; width: 100%; }
        .id-box { 
            font-size: 32px; color: #f1c40f; border: 2px dashed #444; 
            padding: 25px; margin: 25px 0; background: rgba(0,0,0,0.8); 
            border-radius: 10px; font-weight: bold;
        }
        .priority-tag {
            background: #ff0000; color: #fff; font-size: 9px;
            padding: 3px 10px; position: absolute; top: -12px; left: 20px;
            border-radius: 3px; font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<canvas id="matrixCanvas"></canvas>

<div id="loadingScreen">
    <div class="loading-msg">[!] جاري فك تشفير البيانات...</div>
    <div class="bar-container"><div id="bar" class="bar-fill"></div></div>
    <div id="status" style="color:#0f0; font-size:10px; margin-top:10px;">Initializing...</div>
</div>

<div class="main-wrapper">
    <div id="loginPage">
        <h1>ALHWARY NET</h1>
        <p style="color:#666; font-size:12px;">ENCRYPTED ACCESS ONLY</p>
        <div class="id-box" id="myID">------</div>
        <button class="copy-btn" onclick="window.location.href='https://wa.me/201556853817'">تفعيل الحساب الآن</button>
    </div>

    <div id="contentPage" style="display:none; width: 100%; text-align: center;">
        <h1>DECRYPTED_CODES</h1>
        <div id="codesContainer" class="card-container"></div>
    </div>
</div>

<script>
    // --- 1. تأثير الماتريكس (المضمون) ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const alphabet = "0101010101010101";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0"; ctx.font = fontSize + "px monospace";
        drops.forEach((y, i) => {
            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
            ctx.fillText(text, i * fontSize, y * fontSize);
            if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 35);

    // --- 2. نظام الـ ID والتحكم ---
    let userID = localStorage.getItem('h_user_id') || Math.floor(100000 + Math.random() * 900000).toString();
    localStorage.setItem('h_user_id', userID);
    document.getElementById('myID').innerText = userID;

    async function checkAccess() {
        try {
            const res = await fetch(`codes.json?v=${Date.now()}`);
            const data = await res.json();
            
            if (data.site_status === "open" || data.active_users.includes(userID)) {
                if (document.getElementById('contentPage').style.display !== "block" && document.getElementById('loadingScreen').style.display !== "flex") {
                    startLoading(data);
                }
            }
        } catch(e) {}
    }

    function startLoading(data) {
        document.getElementById('loginPage').style.display = "none";
        document.getElementById('loadingScreen').style.display = "flex";
        let progress = 0;
        const statusLines = ["Bypassing Firewall...", "Accessing Database...", "Decrypting AES-256...", "Finalizing..."];
        
        const timer = setInterval(() => {
            progress += 4;
            document.getElementById('bar').style.width = progress + "%";
            document.getElementById('status').innerText = statusLines[Math.floor(progress/30)] || "Done!";
            
            if (progress >= 100) {
                clearInterval(timer);
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = "none";
                    document.getElementById('contentPage').style.display = "block";
                    renderCodes(data);
                }, 500);
            }
        }, 100);
    }

    function renderCodes(data) {
        let html = "";
        data.net_codes.forEach((item, i) => {
            const realCode = atob(item.code);
            html += `
            <div class="code-card">
                ${i < 2 ? '<div class="priority-tag">TOP PRIORITY</div>' : ''}
                <div class="line"><span class="label">CODE:</span> <span class="value">${realCode}</span></div>
                <div class="line"><span class="label">UNITS:</span> <span class="units">${item.units}</span></div>
                <div class="line" style="border:none; font-size:10px; color:#444;"><span>REMAINING:</span> <span>${Math.floor(Math.random()*20)+2} people</span></div>
                <button class="copy-btn" onclick="copyCode('${realCode}')">نسخ الكود 💳</button>
            </div>`;
        });
        document.getElementById('codesContainer').innerHTML = html;
    }

    function copyCode(text) {
        navigator.clipboard.writeText(text);
        alert("✅ تم النسخ: " + text);
    }

    setInterval(checkAccess, 3000);
</script>
</body>
</html>
