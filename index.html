<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | تفعيل الحساب</title>
    <style>
        /* تصميم الهواري نت الاحترافي */
        body {
            background-color: #050000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: linear-gradient(145deg, #0f0000, #1a0000);
            border: 2px solid #c80000;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #c80000;
            font-size: 32px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 span {
            color: #ffffff;
        }

        p {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 25px;
        }

        .id-box {
            background: #000;
            border: 1px dashed #f5c842;
            padding: 20px;
            border-radius: 15px;
            font-size: 24px;
            color: #f5c842;
            margin-bottom: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .id-box:hover {
            background: #111;
            transform: scale(1.02);
        }

        .btn-bot {
            background: linear-gradient(45deg, #c80000, #800000);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-bot:hover {
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.6);
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ALHWARY <span>NET</span></h1>
    <p>أهلاً بك في نظام التفعيل الذكي</p>
    
    <div class="id-box" id="displayID" onclick="copyID()">
        جاري إنشاء ID...
    </div>
    
    <p style="font-size: 14px;">انسخ الرقم أعلاه وأرسله للبوت للحصول على كودك</p>

    <a href="https://t.me/@Shshsijs_bot" target="_blank" class="btn-bot">
        الانتقال للبوت الآن
    </a>

    <div class="footer">
        &copy; 2024 ALHWARY NET - جميع الحقوق محفوظة
    </div>
</div>

<script>
    // وظيفة إنشاء ID ثابت لكل جهاز (بناءً على الـ Local Storage)
    function setupID() {
        let userID = localStorage.getItem('alhwary_user_id');
        
        if (!userID) {
            // توليد رقم عشوائي من 6 أرقام
            userID = Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('alhwary_user_id', userID);
        }
        
        document.getElementById('displayID').innerText = "ID: " + userID;
    }

    // وظيفة النسخ عند الضغط
    function copyID() {
        let idText = document.getElementById('displayID').innerText.replace("ID: ", "");
        navigator.clipboard.writeText(idText);
        alert("تم نسخ الـ ID بنجاح: " + idText);
    }

    // تشغيل الدالة عند تحميل الصفحة
    window.onload = setupID;
</script>

</body>
</html>
