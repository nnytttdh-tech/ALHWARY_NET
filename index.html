<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | طلب تفعيل</title>
    <style>
        body {
            background-color: #050000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: linear-gradient(145deg, #0f0000, #1a0000);
            border: 2px solid #c80000;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
        }

        h1 { color: #c80000; font-size: 32px; margin-bottom: 5px; text-transform: uppercase; }
        h1 span { color: #ffffff; }
        p { color: #cccccc; margin-bottom: 20px; }

        .id-box {
            background: #000;
            border: 1px dashed #f5c842;
            padding: 15px;
            border-radius: 15px;
            font-size: 28px;
            color: #f5c842;
            margin-bottom: 20px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 3px;
        }

        .btn-direct {
            background: linear-gradient(45deg, #c80000, #800000);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(200, 0, 0, 0.3);
        }

        .btn-direct:hover {
            box-shadow: 0 0 25px #c80000;
            transform: translateY(-3px);
        }

        .note { font-size: 13px; color: #888; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>ALHWARY <span>NET</span></h1>
    <p>نظام طلب أكواد التفعيل</p>
    
    <div class="id-box" id="displayID" onclick="copyID()" title="اضغط للنسخ">
        جاري الإنشاء...
    </div>
    
    <p style="font-size: 14px;">انسخ الـ ID أعلاه، ثم اضغط بالأسفل لإرساله للمدير لتفعيل حسابك.</p>

    <a href="https://t.me/X_WUK" target="_blank" class="btn-direct">
        إرسال الـ ID للمدير (X_WUK)
    </a>

    <div class="note">
        * اضغط على الرقم لنسخه تلقائياً.<br>
        * سيتم تفعيل حسابك فور استلام الرسالة.
    </div>
</div>

<script>
    // إنشاء ID فريد لكل مستخدم
    function setupID() {
        let userID = localStorage.getItem('alhwary_user_id');
        if (!userID) {
            userID = Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('alhwary_user_id', userID);
        }
        document.getElementById('displayID').innerText = userID;
    }

    // وظيفة النسخ الذكي
    function copyID() {
        let idText = document.getElementById('displayID').innerText;
        navigator.clipboard.writeText(idText).then(() => {
            alert("✅ تم نسخ الـ ID بنجاح: " + idText + "\nتوجه الآن للمدير لتفعيله.");
        });
    }

    window.onload = setupID;
</script>

</body>
</html>
