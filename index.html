<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c80000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALHWARY NET">
<title>ALHWARY NET</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* --- الهوية البصرية --- */
:root {
  --r:#c80000; --r2:#e60000; --dark:#070000; --s1:#0f0000; --s2:#160000;
  --bd:rgba(200,0,0,.14); --bd2:rgba(200,0,0,.26);
  --tx:#f0ecec; --mu:#5a3333; --mu2:#9a6060; --gold:#f5c842;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { 
    background:var(--dark); color:var(--tx); 
    font-family:'Cairo', sans-serif; height:100vh; overflow:hidden; 
    display:flex; flex-direction:column;
}

/* خلفية متدرجة */
body::before {
  content:''; position:fixed; inset:0; z-index:0;
  background: radial-gradient(ellipse 90% 35% at 50% -5%,rgba(200,0,0,.2) 0%,transparent 70%);
}

/* --- الهيدر --- */
.hdr { position:relative; z-index:100; padding:calc(var(--st) + 10px) 15px 10px; background:rgba(7,0,0,.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--bd); }
.hdr-row { display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-ico { width:35px; height:35px; border-radius:10px; background:linear-gradient(145deg,#e60000,#550000); display:flex; align-items:center; justify-content:center; font-weight:900; box-shadow:0 0 15px rgba(230,0,0,0.3); }
.logo-txt { font-size:1.1rem; font-weight:900; letter-spacing:0.5px; }

/* --- منطقة الكروت --- */
.scrl { flex:1; overflow-y:auto; padding:15px 15px 100px; position:relative; z-index:1; }
.card { border-radius:18px; background:var(--s1); border:1px solid var(--bd); margin-bottom:15px; overflow:hidden; animation: fadeInUp 0.4s ease; }
@keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

.c-band { display:flex; background:rgba(245,200,66,0.05); border-bottom:1px solid rgba(245,200,66,0.1); }
.c-code { flex:1; padding:15px; font-family:'Space Mono', monospace; color:var(--gold); font-size:1rem; text-align:center; letter-spacing:1px; }
.c-copy { padding:0 20px; background:rgba(245,200,66,0.1); border:none; color:var(--gold); font-weight:bold; cursor:pointer; }

.c-details { padding:15px; display:flex; justify-content:space-between; align-items:center; }
.c-val { font-size:1.4rem; font-weight:900; font-family:'Space Mono'; color:var(--tx); }
.c-label { font-size:0.65rem; color:var(--mu2); text-transform:uppercase; margin-bottom:2px; }

/* --- الشريط السفلي --- */
.bot { position:fixed; bottom:0; left:0; right:0; padding:10px 15px calc(var(--sb) + 10px); background:rgba(7,0,0,0.95); border-top:1px solid var(--bd); display:flex; align-items:center; justify-content:space-between; z-index:100; }
.price-btn { background:rgba(245,200,66,0.1); color:var(--gold); border:1px solid var(--gold); padding:8px 16px; border-radius:20px; font-size:0.8rem; font-weight:bold; cursor:pointer; }
.by { font-size:0.75rem; color:var(--mu2); }
.by b { color:var(--r2); }

/* --- الحاسبة (Modal) --- */
.mbg { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:none; align-items:flex-end; z-index:500; }
.mbox { width:100%; background:#110000; border-radius:25px 25px 0 0; padding:20px 20px calc(var(--sb) + 30px); border-top:2px solid var(--r2); transform:translateY(100%); transition:transform 0.3s ease; }
.mbg.open { display:flex; }
.mbg.open .mbox { transform:translateY(0); }
.minput { width:100%; background:var(--s2); border:1px solid var(--bd); padding:15px; border-radius:12px; color:#fff; font-size:1.1rem; margin-top:10px; outline:none; text-align:center; }

/* --- التنبيه (Toast) --- */
#toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#fff; color:#000; padding:8px 20px; border-radius:20px; font-weight:bold; font-size:0.8rem; display:none; z-index:1000; }

/* --- القائمة الجانبية --- */
.side-menu { position:fixed; top:0; right:-280px; width:280px; height:100%; background:#0a0000; z-index:600; transition:0.3s; border-left:1px solid var(--bd); padding:50px 20px; }
.side-menu.active { right:0; }
.menu-item { padding:15px; border-bottom:1px solid var(--bd); color:var(--tx); display:block; text-decoration:none; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div class="ib" style="font-size:24px; cursor:pointer;" onclick="toggleMenu()">☰</div>
    <div class="logo">
      <div class="logo-txt">ALHWARY <span style="color:var(--r2)">NET</span></div>
      <div class="logo-ico">H</div>
    </div>
  </div>
</div>

<div class="scrl">
  <div class="lhd" style="text-align:center; margin-bottom:20px;">
    <span style="font-size:0.7rem; color:var(--mu2); letter-spacing:2px;">الكروت المتاحة حالياً</span>
  </div>

  <div class="card">
    <div class="c-band">
      <div class="c-code" id="code1">1092-8827-3361-9902</div>
      <button class="c-copy" onclick="copyCode('1092-8827-3361-9902')">نسخ</button>
    </div>
    <div class="c-details">
      <div>
        <div class="c-label">قيمة الشحن</div>
        <div class="c-val">50 <small style="font-size:10px">EGP</small></div>
      </div>
      <div style="text-align:left">
        <div class="c-label">الشبكة</div>
        <div style="color:var(--r2); font-weight:bold;">VODAFONE</div>
      </div>
    </div>
  </div>
</div>

<div class="side-menu" id="sideMenu">
    <div style="text-align:left; font-size:24px; margin-bottom:30px; cursor:pointer;" onclick="toggleMenu()">✕</div>
    <a href="#" class="menu-item">الرئيسية</a>
    <a href="#" class="menu-item">أسعار الجملة</a>
    <a href="#" class="menu-item">اتصل بنا</a>
</div>

<div class="bot">
  <div class="by">© 2026 <b>ALHWARY NET</b></div>
  <button class="price-btn" onclick="openCalc()">حاسبة الأسعار</button>
</div>

<div class="mbg" id="calcModal" onclick="closeCalc()">
  <div class="mbox" onclick="event.stopPropagation()">
    <div style="width:40px; height:4px; background:var(--bd2); margin:0 auto 15px; border-radius:2px;"></div>
    <h3 style="text-align:center; margin-bottom:10px;">حاسبة الرصيد</h3>
    <p style="font-size:0.7rem; color:var(--mu2); text-align:center;">أدخل المبلغ الذي تريد دفعه لمعرفة الرصيد</p>
    <input type="number" class="minput" id="amountInput" placeholder="0.00">
    <div id="res" style="margin-top:20px; text-align:center; font-size:1.8rem; font-weight:900; color:var(--gold);">0.00 <small style="font-size:0.8rem">رصيد صافي</small></div>
    <button onclick="closeCalc()" style="width:100%; padding:15px; background:var(--r2); color:#fff; border:none; border-radius:12px; margin-top:20px; font-weight:bold;">إغلاق</button>
  </div>
</div>

<div id="toast">تم النسخ بنجاح!</div>

<script>
// وظيفة فتح/إغلاق القائمة
function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
}

// وظيفة نسخ الكود
function copyCode(text) {
    navigator.clipboard.writeText(text).then(() => {
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2000);
    });
}

// وظائف الحاسبة
function openCalc() { document.getElementById('calcModal').classList.add('open'); }
function closeCalc() { document.getElementById('calcModal').classList.remove('open'); }

document.getElementById('amountInput').addEventListener('input', function(e) {
    let val = e.target.value;
    // مثال: الرصيد الصافي = المبلغ / 1.43
    let result = val > 0 ? (val / 1.43).toFixed(2) : "0.00";
    document.getElementById('res').innerHTML = result + ' <small style="font-size:0.8rem">رصيد صافي</small>';
});
</script>

</body>
</html>
