<script>
    async function loadCodes() {
        try {
            // سحب البيانات من الملف اللي البوت بيحدثه
            const response = await fetch('./codes.json?v=' + Date.now());
            if (!response.ok) return;

            const data = await response.json();
            const container = document.getElementById('codes-container');
            
            if (data.length === 0) {
                container.innerHTML = 'لا توجد أكواد جديدة حالياً';
                return;
            }

            // عرض الأكواد بشكل منظم
            container.innerHTML = ''; 
            data.forEach(item => {
                const codeDiv = document.createElement('div');
                codeDiv.style.border = "1px solid red";
                codeDiv.style.margin = "10px";
                codeDiv.style.padding = "10px";
                // تأكد إن البوت بيبعت الحقل باسم 'code' جوه الـ JSON
                codeDiv.textContent = item.code || "كود غير معروف"; 
                container.appendChild(codeDiv);
            });
        } catch (e) {
            console.log("في انتظار تحديث الملف من البوت...");
        }
    }

    // تشغيل الدالة وتكرارها كل 10 ثواني
    loadCodes();
    setInterval(loadCodes, 10000);
</script>
