<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY RADAR | VIP SYSTEM</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --alert: #ff3e3e; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: 'Courier New', monospace; overflow: hidden; color: var(--neon); }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.2; }
        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .terminal { background: rgba(0,0,0,0.95); border: 1px solid var(--neon); padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(0,255,65,0.3); position: relative; }
        .header { text-align: center; font-size: 22px; border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; letter-spacing: 2px; }
        #status { font-size: 14px; margin-bottom: 10px; height: 20px; }
        .id-box { background: rgba(0,255,65,0.1); border: 1px dashed var(--neon); padding: 12px; margin: 15px 0; font-size: 15px; text-align: center; cursor: pointer; word-break: break-all; transition: 0.3s; }
        .id-box:hover { background: rgba(0,255,65,0.2); }
        .code-box { border: 1px solid var(--neon); margin: 10px 0; padding: 12px; background: rgba(0,255,65,0.05); display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .btn-whatsapp { display: block; width: 100%; padding: 14px; background: #25d366; color: white; text-decoration: none; text-align: center; border-radius: 5px; font-weight: bold; margin-top: 20px; transition: 0.3s; border: none; cursor: pointer; }
        .btn-whatsapp:hover { background: #128c7e; transform: translateY(-2px); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; margin-top: 25px; border-top: 1px solid #333; padding-top: 10px; opacity: 0.7; }
        .alert { color: var(--alert); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #main-content { min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="terminal">
        <div class="header">ALHWARY VIP □</div>
        <div id="status">> LOADING SYSTEM...</div>
        
        <div id="main-content">
            <div style="text-align:center">جارِ جلب البيانات من السيرفر...</div>
        </div>

        <div class="stat-grid">
            <div>PING: <span id="ping">0</span>ms</div>
            <div>ID: <span id="mini-id" style="color:white">...</span></div>
        </div>
    </div>
</div>

<script>
    // --- الإعدادات ---
    const GITHUB_URL = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";
    const WHATSAPP_NUMBER = "201556853817"; // ضع رقمك هنا

    // --- توليد معرف الجهاز ---
    function getDeviceID() {
        const info = window.navigator.userAgent + window.screen.width + window.navigator.language;
        let hash = 0;
        for (let i = 0; i < info.length; i++) {
            hash = ((hash << 5) - hash) + info.charCodeAt(i);
            hash |= 0; 
        }
        return "HW-" + Math.abs(hash).toString(16).toUpperCase();
    }
    const myID = getDeviceID();
    document.getElementById('mini-id').innerText = myID;

    // --- نظام التحقق الذكي ---
    async function checkAccess() {
        const pStart = performance.now();
        const contentDiv = document.getElementById('main-content');
        const statusDiv = document.getElementById('status');
        const today = new Date().toISOString().split('T')[0];

        try {
            // جلب البيانات مع منع التخزين المؤقت (Cache)
            const res = await fetch(GITHUB_URL + "?v=" + Date.now());
            if (!res.ok) throw new Error("Server Error");
            const data = await res.json();
            
            document.getElementById('ping').innerText = Math.floor(performance.now() - pStart);

            // تأمين الكود من الخطأ إذا كانت المصفوفات ناقصة في ملف الـ JSON
            const devices = data.authorized_devices || [];
            const codes = data.net_codes || [];
            const device = devices.find(d => d.id === myID);

            if (data.site_status === "open") {
                if (device) {
                    // فحص تاريخ الانتهاء
                    const isPermanent = device.expire_at === "permanent";
                    const isNotExpired = device.expire_at >= today;

                    if (isPermanent || isNotExpired) {
                        statusDiv.innerHTML = "> <span style='color:white'>ACCESS GRANTED ✅</span>";
                        let html = "";
                        if (codes.length > 0) {
                            codes.forEach(c => {
                                try {
                                    let decoded = atob(c.code);
                                    html += `<div class="code-box"><span>${decoded}</span><span style="color:#888; font-size:10px">${c.units}U</span></div>`;
                                } catch(e) { console.log("Decode error"); }
                            });
                        } else {
                            html = "<p>لا توجد أكواد متاحة حالياً.</p>";
                        }
                        contentDiv.innerHTML = html;
                    } else {
                        statusDiv.innerHTML = "> <span class='alert'>EXPIRED / انتهى الاشتراك ❌</span>";
                        contentDiv.innerHTML = `<p>انتهى اشتراكك بتاريخ: ${device.expire_at}</p><a href="https://wa.me/${WHATSAPP_NUMBER}" class="btn-whatsapp">تجديد الآن</a>`;
                    }
                } else {
                    // حالة الجهاز غير مفعل
                    statusDiv.innerHTML = "> <span class='alert'>UNAUTHORIZED / غير مفعل ⚠️</span>";
                    contentDiv.innerHTML = `
                        <p style="font-size:12px; color:#aaa;">أرسل المعرف التالي للمطور لتفعيل VIP:</p>
                        <div class="id-box" onclick="copyID()">${myID}</div>
                        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=تفعيل_ID:${myID}" class="btn-whatsapp">تفعيل عبر واتساب</a>
                    `;
                }
            } else {
                statusDiv.innerHTML = "> <span class='alert'>SYSTEM CLOSED / الموقع مغلق</span>";
                contentDiv.innerHTML = "<p>النظام مغلق حالياً للصيانة أو التحديث.</p>";
            }
        } catch(e) {
            statusDiv.innerHTML = "> <span class='alert'>CONNECTION ERROR <</span>";
            // لا نغير محتوى main-content هنا حتى لا تختفي الواجهة عند ضعف الإنترنت
        }
    }

    function copyID() {
        navigator.clipboard.writeText(myID);
        alert("تم نسخ معرف الجهاز بنجاح: " + myID);
    }

    // --- تأثير الماتريكس ---
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function drawMatrix() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
            if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }

    setInterval(drawMatrix, 40);
    setInterval(checkAccess, 5000); // تحديث كل 5 ثوانٍ
    checkAccess();
</script>
</body>
</html>
