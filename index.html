<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O2 Card - لوحة الكروت</title>
    <style>
        /* التنسيق ليكون شبه الصورة بالظبط */
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: #ff3b3b;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #cardsList {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: linear-gradient(145deg, #1a1a1a, #262626);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card-code {
            color: #fbff00;
            font-size: 22px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
        }
        .stat-box { text-align: center; }
        .stat-value {
            display: block;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-charge {
            background-color: #d32f2f;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-charge:hover { background-color: #ff1717; }
        .loading { text-align: center; color: #888; }
    </style>
</head>
<body>

    <div class="header">O2 CARD - الكروت المتاحة</div>
    
    <div id="cardsList" class="loading">جاري سحب أحدث الكروت...</div>

    <script>
        const targetUrl = 'https://repository-o2oweb.onrender.com/get-cards';
        // استخدام بروكسي لتخطي حماية المتصفح (CORS)
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

        async function updateCards() {
            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // تحويل النص المستلم لـ JSON حقيقي
                const apiData = JSON.parse(data.contents);
                const cards = apiData.cards;

                const container = document.getElementById('cardsList');
                container.innerHTML = ''; // تنظيف القائمة قبل التحديث

                cards.forEach(card => {
                    // بناء شكل الكارت بناءً على البيانات (Serial, Units, Remaining)
                    container.innerHTML += `
                        <div class="card">
                            <div class="card-code">*858*${card.card_serial}#</div>
                            <div class="card-stats">
                                <div class="stat-box">
                                    الوحدات
                                    <span class="stat-value">${card.gift_units}</span>
                                </div>
                                <div class="stat-box">
                                    متبقي
                                    <span class="stat-value">${card.remaining_dedications}</span>
                                </div>
                            </div>
                            <button class="btn-charge" onclick="window.location.href='tel:*858*${card.card_serial}#'">📞 شحن الكارت</button>
                        </div>
                    `;
                });

                console.log("تم التحديث بنجاح: " + new Date().toLocaleTimeString());

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('cardsList').innerHTML = "فشل في تحديث البيانات. جاري المحاولة مرة أخرى...";
            }
        }

        // تشغيل التحديث كل 10 ثواني (10000 مللي ثانية)
        setInterval(updateCards, 10000);

        // تشغيل أول مرة عند فتح الصفحة
        updateCards();
    </script>
</body>
</html>
