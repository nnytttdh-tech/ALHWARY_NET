<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | التفعيل السريع</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #0a0a0a; border: 2px solid #25d366; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 0 20px rgba(37,211,102,0.2); }
        h1 { color: #25d366; margin-bottom: 10px; font-size: 26px; text-shadow: 0 0 10px rgba(37,211,102,0.5); }
        h1 span { color: #fff; }
        .id-box { font-size: 38px; color: #f5c842; background: #111; padding: 15px; border-radius: 12px; border: 2px dashed #25d366; margin: 20px 0; font-weight: bold; letter-spacing: 3px; }
        .btn-wa { background: #25d366; color: #000; text-decoration: none; padding: 14px; border-radius: 10px; display: block; font-weight: bold; font-size: 17px; margin-top: 10px; }
        .status-text { margin-top: 20px; color: #888; font-size: 14px; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .code-item { background: #1a1a1a; border: 1px solid #333; border-right: 5px solid #25d366; border-radius: 10px; margin: 12px 0; padding: 15px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; position: relative; }
        .code-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .code-name { font-size: 13px; color: #888; }
        .units-badge { background: #25d366; color: #000; padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .code-val { color: #f5c842; font-weight: bold; font-size: 20px; font-family: monospace; cursor: pointer; width: 100%; text-align: center; margin-top: 5px; background: #000; padding: 5px; border-radius: 5px; }
        
        #contentPage { display: none; width: 100%; max-width: 400px; padding: 10px; }
        .scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 5px; }
        .expiry-info { color: #f5c842; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginPage" class="card">
    <h1>ALHWARY <span>NET</span></h1>
    <p style="color:#ccc;">انسخ الـ ID الخاص بك وأرسله للمدير:</p>
    <div id="myID" class="id-box">...</div>
    <a href="#" id="waLink" class="btn-wa">إرسال الـ ID لتفعيل الحساب</a>
    <p class="status-text">⏳ في انتظار التفعيل... (لا تغلق الصفحة)</p>
</div>

<div id="contentPage">
    <div class="card" style="max-width: 100%;">
        <h1>🎁 هداياك يا بطل</h1>
        <div id="expiryText" class="expiry-info"></div>
        <div id="codesContainer" class="scroll-area"></div>
        <button onclick="localStorage.removeItem('h_user_id'); location.reload();" style="background:#cc0000; color:#fff; border:none; padding:10px; width:100%; border-radius:8px; margin-top:15px; font-weight:bold; cursor:pointer;">تسجيل خروج</button>
    </div>
</div>

<script>
    let userID = localStorage.getItem('h_user_id');
    if (!userID) {
        userID = Math.floor(100000 + Math.random() * 900000).toString();
        localStorage.setItem('h_user_id', userID);
    }
    document.getElementById('myID').innerText = userID;

    const myNumber = "201556853817"; 
    document.getElementById('waLink').href = `https://wa.me/${myNumber}?text=يا هواري فعل لي الـ ID ده: ${userID}`;

    async function checkActivation() {
        try {
            // حل مشكلة الايباد والتأخير: منع الكاش تماماً بجلب رابط فريد كل ثانية
            const response = await fetch(`codes.json?nocache=${Date.now()}`, {
                cache: "no-store",
                headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
            });
            
            if (!response.ok) return;
            const data = await response.json();

            // فحص إذا كان الـ ID مفعل
            if (data.active_users && data.active_users.includes(userID)) {
                document.getElementById('loginPage').style.display = "none";
                document.getElementById('contentPage').style.display = "block";
                
                // عرض الأكواد بتنسيق جديد
                let html = "";
                if (data.net_codes && data.net_codes.length > 0) {
                    data.net_codes.forEach(item => {
                        html += `
                        <div class="code-item">
                            <div class="code-header">
                                <span class="code-name">🎁 كود نت هدية</span>
                                <span class="units-badge">${item.units} وحدة</span>
                            </div>
                            <div class="code-val" onclick="navigator.clipboard.writeText('${item.code}'); alert('تم نسخ الكود')">${item.code}</div>
                        </div>`;
                    });
                } else {
                    html = "<p style='color:#888;'>لا توجد أكواد متاحة.</p>";
                }
                document.getElementById('codesContainer').innerHTML = html;
                clearInterval(checkTimer);
            }
        } catch (error) {
            console.error("Connection error");
        }
    }

    const checkTimer = setInterval(checkActivation, 1000);
</script>
</body>
</html>
