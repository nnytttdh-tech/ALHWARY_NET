<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | SECURE SYSTEM</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #ccc; font-family: 'Courier New', monospace; overflow: hidden; }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .main-wrapper { position: relative; z-index: 2; height: 100vh; width: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 20px; background: rgba(0, 0, 0, 0.3); }
        
        /* شاشة التحميل */
        #loadingScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .bar-container { width: 80%; max-width: 400px; height: 12px; border: 1px solid #0f0; background: #050505; margin-top: 15px; }
        .bar-fill { width: 0%; height: 100%; background: #0f0; box-shadow: 0 0 15px #0f0; transition: 0.1s; }

        /* الكروت */
        .code-card { background: rgba(10, 10, 10, 0.9); border: 1px solid #1a1a1a; border-top: 3px solid #f00; margin-bottom: 20px; padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; position: relative; }
        .line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .copy-btn { background: #f00; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        
        #loginPage { text-align: center; margin-top: 30%; width: 100%; }
        .id-box { font-size: 32px; color: #f1c40f; border: 2px dashed #444; padding: 20px; margin: 20px 0; background: rgba(0,0,0,0.8); }
        h1 { color: #f00; text-shadow: 0 0 10px #f00; }
        .status-msg { color: #555; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<canvas id="matrixCanvas"></canvas>

<div id="loadingScreen">
    <div style="color:#0f0; font-weight:bold;">[!] جاري التحقق من صلاحية الاشتراك...</div>
    <div class="bar-container"><div id="bar" class="bar-fill"></div></div>
</div>

<div class="main-wrapper">
    <div id="loginPage">
        <h1>ALHWARY NET</h1>
        <div class="id-box" id="myID">------</div>
        <button class="copy-btn" onclick="requestActivation()">تفعيل الحساب (WhatsApp)</button>
        <div class="status-msg" id="statusMsg">الحالة: في انتظار التفعيل...</div>
    </div>

    <div id="contentPage" style="display:none; width: 100%; text-align: center;">
        <h1>DECRYPTED_CODES</h1>
        <div id="codesContainer"></div>
        <button class="copy-btn" onclick="location.reload()" style="background:#333; margin-top:30px;">تحديث القائمة</button>
    </div>
</div>

<script>
    // تأثير الماتريكس
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#0f0"; ctx.font = "16px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
            if (y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 40);

    // نظام الـ ID والوقت
    let userID = localStorage.getItem('h_user_id') || Math.floor(100000 + Math.random() * 900000).toString();
    localStorage.setItem('h_user_id', userID);
    document.getElementById('myID').innerText = userID;

    function requestActivation() {
        window.location.href = `https://wa.me/201556853817?text=تفعيل_اي_دي:${userID}`;
    }

    async function checkAccess() {
        try {
            const res = await fetch(`codes.json?v=${Date.now()}`);
            const data = await res.json();
            
            let hasAccess = false;
            if (data.site_status === "open") {
                hasAccess = true;
            } else if (data.active_users && data.active_users[userID]) {
                const expiryDate = new Date(data.active_users[userID]);
                if (expiryDate > new Date()) {
                    hasAccess = true;
                } else {
                    document.getElementById('statusMsg').innerText = "الحالة: انتهت مدة اشتراكك!";
                    document.getElementById('statusMsg').style.color = "red";
                }
            }

            if (hasAccess && document.getElementById('contentPage').style.display !== "block") {
                startLoading(data);
            }
        } catch(e) {}
    }

    function startLoading(data) {
        document.getElementById('loginPage').style.display = "none";
        document.getElementById('loadingScreen').style.display = "flex";
        let p = 0;
        const int = setInterval(() => {
            p += 5; document.getElementById('bar').style.width = p + "%";
            if (p >= 100) { 
                clearInterval(int); 
                document.getElementById('loadingScreen').style.display = "none";
                document.getElementById('contentPage').style.display = "block";
                render(data);
            }
        }, 80);
    }

    function render(data) {
        let html = "";
        data.net_codes.forEach(item => {
            const code = atob(item.code);
            html += `<div class="code-card">
                <div class="line"><span>CODE:</span> <span style="color:#fff">${code}</span></div>
                <div class="line"><span>UNITS:</span> <span style="color:#0f0">${item.units}</span></div>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${code}');alert('تم النسخ')">نسخ الكود</button>
            </div>`;
        });
        document.getElementById('codesContainer').innerHTML = html;
    }

    setInterval(checkAccess, 4000);
</script>
</body>
</html>
