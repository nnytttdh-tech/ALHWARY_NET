<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ALHWARY_NET</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .code-box { border: 2px solid red; margin: 20px auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 15px; background: #111; }
        .msg { color: #ff4444; font-size: 18px; }
    </style>
</head>
<body>
    <h1 style="color:white">ALHWARY <span style="color:red">NET</span></h1>
    <div id="display">
        <p class="msg">في انتظار بيانات البوت...</p>
    </div>

    <script>
        async function loadData() {
            try {
                // سحب الملف المحلي من المستودع مباشرة لتجنب أخطاء CORS
                const resp = await fetch('./codes.json?t=' + Date.now());
                if (!resp.ok) throw new Error();
                const data = await resp.json();
                
                const display = document.getElementById('display');
                display.innerHTML = ''; 

                data.forEach(item => {
                    display.innerHTML += `<div class="code-box"><h2 style="color:#0f0">${item.code}</h2></div>`;
                });
            } catch (e) {
                document.getElementById('display').innerHTML = '<p class="msg">فشل جلب البيانات. تأكد أن البوت قام بتحديث ملف codes.json</p>';
            }
        }
        setInterval(loadData, 5000); // تحديث كل 5 ثواني
        loadData();
    </script>
</body>
</html>
