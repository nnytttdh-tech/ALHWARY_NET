<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>✧ 𝑨𝑳𝑯𝑾𝑨𝑹𝒀 𝑨𝒊 ✧</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/tokyo-night-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<style>
:root{
 --bg:#070b12;--panel:rgba(12,18,30,.88);--panel2:rgba(18,26,42,.92);
 --cyan:#00d9ff;--blue:#168cff;--gold:#ffd45a;--text:#e8f0fa;
 --muted:#8fa0b7;--border:rgba(0,217,255,.18);
 --glow:0 0 28px rgba(0,217,255,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{
 position:fixed;top:0;left:0;right:0;height:68px;z-index:20;
 display:flex;align-items:center;justify-content:space-between;padding:8px 18px;
 background:rgba(7,11,18,.86);backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border)
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
 background:linear-gradient(135deg,var(--cyan),var(--blue),#7655ff);
 box-shadow:var(--glow);font-size:20px;color:#061018
}
.brand h1{
 font-family:Orbitron,Cairo,sans-serif;font-size:16px;
 background:linear-gradient(90deg,var(--cyan),#fff,var(--gold));
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.brand p{font-size:9px;color:var(--muted)}
.header-actions{display:flex;gap:7px}
.icon-btn{
 width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.035);
 color:var(--cyan);border:1px solid var(--border);transition:.2s
}
.icon-btn:hover{background:rgba(0,217,255,.12);transform:translateY(-1px)}
.app{position:relative;z-index:5;height:100dvh;padding:78px 10px 8px}
.chat{
 width:min(920px,100%);height:100%;margin:auto;overflow-y:auto;
 padding:10px 4px 165px;scroll-behavior:smooth
}
.chat::-webkit-scrollbar{width:5px}.chat::-webkit-scrollbar-thumb{background:#145d77;border-radius:8px}
.welcome{text-align:center;margin:45px auto 20px;max-width:600px}
.welcome-icon{
 width:70px;height:70px;margin:auto;border-radius:22px;display:grid;place-items:center;
 background:linear-gradient(135deg,rgba(0,217,255,.16),rgba(118,85,255,.18));
 border:1px solid var(--border);box-shadow:var(--glow);font-size:28px;color:var(--cyan)
}
.welcome h2{font-size:23px;margin-top:12px}.welcome p{font-size:12px;color:var(--muted);margin-top:5px}
.message{display:flex;gap:9px;align-items:flex-start;margin:12px 0;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.message.user{flex-direction:row-reverse}
.avatar{
 flex:0 0 36px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
 background:linear-gradient(135deg,#10293a,#15203b);border:1px solid var(--border);color:var(--cyan)
}
.user .avatar{color:#061018;background:linear-gradient(135deg,var(--cyan),var(--blue))}
.message-body{max-width:min(82%,760px)}
.bubble{
 background:var(--panel);border:1px solid var(--border);border-radius:17px;
 padding:12px 14px;line-height:1.8;font-size:13px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)
}
.user .bubble{background:linear-gradient(135deg,#00bfe4,#1778df);color:#031019;border:0;font-weight:600}
.bubble p{margin:4px 0}.bubble ul,.bubble ol{padding-right:20px}
.bubble pre{
 direction:ltr;text-align:left;background:#111522!important;border:1px solid #25324a;
 border-radius:12px;padding:14px;margin:10px 0;overflow:auto;position:relative
}
.bubble code{font-family:Consolas,monospace;font-size:12px}
.code-actions{display:flex;gap:6px;direction:ltr;position:absolute;top:7px;right:7px;z-index:2}
.code-btn{
 border:1px solid #34445e;background:#1a2334;color:#dce8f8;border-radius:7px;
 padding:4px 7px;font-size:10px
}
.code-btn:hover{background:#00bfe4;color:#061018}
.composer-wrap{
 position:fixed;z-index:15;left:0;right:0;bottom:0;padding:8px 10px 10px;
 background:linear-gradient(transparent,rgba(7,11,18,.96) 22%);pointer-events:none
}
.composer{
 pointer-events:auto;width:min(920px,100%);margin:auto;background:var(--panel);
 border:1px solid var(--border);border-radius:19px;padding:8px;backdrop-filter:blur(18px);box-shadow:var(--glow)
}
.preview{display:none;gap:7px;overflow-x:auto;padding:2px 2px 8px}.preview.active{display:flex}
.preview-item{position:relative;flex:0 0 62px;width:62px;height:62px;border-radius:11px;overflow:hidden;border:1px solid var(--border);background:#101725}
.preview-item img{width:100%;height:100%;object-fit:cover}.preview-file{height:100%;display:grid;place-items:center;color:var(--cyan);font-size:22px}
.remove-file{
 position:absolute;top:2px;left:2px;width:20px;height:20px;border:0;border-radius:50%;
 background:rgba(0,0,0,.75);color:#fff;font-size:13px;line-height:20px
}
.input-row{display:flex;align-items:flex-end;gap:7px}
#prompt{
 flex:1;min-width:0;max-height:130px;min-height:45px;resize:none;outline:none;border:0;
 background:transparent;color:#fff;padding:9px;font-size:13px;line-height:1.6
}
.action-btn,.send-btn{
 width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
 background:rgba(255,255,255,.035);color:var(--cyan);display:grid;place-items:center
}
.send-btn{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#041019;border:0}
.action-btn:hover{background:rgba(0,217,255,.12)}.send-btn:hover{transform:translateY(-1px)}
.action-btn input{display:none}
.attachments{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.attachment{max-width:180px}
.attachment img{width:150px;max-height:130px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.file-box{
 display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;
 background:rgba(0,0,0,.18);font-size:11px;direction:ltr
}
.file-box i{color:var(--cyan)}
.toast{
 position:fixed;z-index:100;left:50%;bottom:115px;transform:translate(-50%,20px);
 opacity:0;pointer-events:none;background:#111a29;border:1px solid var(--border);
 padding:8px 13px;border-radius:10px;font-size:11px;transition:.2s;box-shadow:var(--glow)
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{
 position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
 display:none;align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}.modal-box{
 width:min(900px,100%);height:min(80dvh,700px);background:#0d1420;border:1px solid var(--border);
 border-radius:18px;overflow:hidden;display:flex;flex-direction:column
}
.modal-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:14px;color:var(--cyan)}.modal-head button{background:none;border:0;color:#ff7373;font-size:20px}
.runner{flex:1;border:0;background:#fff}
.side{
 position:fixed;right:-310px;top:0;bottom:0;width:290px;z-index:40;
 background:rgba(10,16,27,.97);border-left:1px solid var(--border);padding:18px;transition:.3s
}
.side.show{right:0}.side h3{color:var(--cyan);margin-bottom:18px}
.side button{width:100%;padding:12px;margin-bottom:9px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:#fff;text-align:right}
.side-overlay{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.5);display:none}.side-overlay.show{display:block}
footer{text-align:center;color:#53647a;font-size:9px;margin-top:7px}

@media(max-width:600px){
 header{height:62px;padding:7px 9px}.logo{width:42px;height:42px}.brand h1{font-size:13px}.brand p{font-size:8px}
 .icon-btn{width:38px;height:38px;border-radius:11px}.app{padding-top:68px}
 .chat{padding:5px 1px 160px}.welcome{margin-top:25px}.welcome h2{font-size:19px}
 .welcome-icon{width:60px;height:60px}.message-body{max-width:calc(100vw - 62px)}
 .bubble{font-size:12px;padding:10px 11px;border-radius:15px}.avatar{width:32px;height:32px;flex-basis:32px}
 .bubble pre{font-size:10px}.bubble code{font-size:10px}.composer-wrap{padding:6px 6px 8px}
 .composer{border-radius:17px}.action-btn,.send-btn{width:39px;height:39px}
 #prompt{font-size:12px}.side{width:82vw}
}
</style>
</head>

<body>
<canvas id="particles"></canvas>

<header>
 <div class="brand">
  <div class="logo"><i class="fa-solid fa-sparkles"></i></div>
  <div>
   <h1>✧ 𝑨𝑳𝑯𝑾𝑨𝑹𝒀 𝑨𝒊 ✧</h1>
   <p>مساعدك الذكي — سريع ومتجاوب</p>
  </div>
 </div>
 <div class="header-actions">
  <button class="icon-btn" onclick="clearChat()" title="مسح"><i class="fa-solid fa-trash"></i></button>
  <button class="icon-btn" onclick="openSide()" title="القائمة"><i class="fa-solid fa-bars"></i></button>
 </div>
</header>

<div class="side-overlay" id="sideOverlay" onclick="closeSide()"></div>
<aside class="side" id="side">
 <h3>خيارات ALHWARY AI</h3>
 <button onclick="clearChat();closeSide()"><i class="fa-solid fa-broom"></i> مسح المحادثة</button>
 <button onclick="document.getElementById('fileInput').click();closeSide()"><i class="fa-solid fa-paperclip"></i> إرفاق ملف</button>
 <button onclick="closeSide();showToast('ALHWARY AI جاهز 🚀')"><i class="fa-solid fa-bolt"></i> حالة النظام</button>
 <button onclick="closeSide()"><i class="fa-solid fa-xmark"></i> إغلاق</button>
</aside>

<main class="app">
 <div class="chat" id="chat">
  <div class="welcome" id="welcome">
   <div class="welcome-icon"><i class="fa-solid fa-robot"></i></div>
   <h2>مرحباً بك في 𝑨𝑳𝑯𝑾𝑨𝑹𝒀 𝑨𝒊</h2>
   <p>اسأل، أرسل صورة، ارفع ملفاً، أو اطلب كتابة وتجربة كود.</p>
  </div>
 </div>
</main>

<div class="composer-wrap">
 <div class="composer">
  <div class="preview" id="preview"></div>
  <div class="input-row">
   <button class="action-btn" title="إرفاق صورة أو ملف" onclick="document.getElementById('fileInput').click()">
    <i class="fa-solid fa-paperclip"></i>
    <input id="fileInput" type="file" multiple accept="image/*,.txt,.json,.js,.jsx,.ts,.tsx,.html,.htm,.css,.scss,.md,.csv,.xml,.yaml,.yml,.py,.java,.c,.cpp,.php,.sql,.sh,.pdf,.doc,.docx">
   </button>
   <textarea id="prompt" rows="1" placeholder="اكتب سؤالك هنا..." onkeydown="handleKey(event)" oninput="resizeInput(this)"></textarea>
   <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
  <footer>⚜️ Developed By El-Hawary & Ali Weka ⚜️</footer>
 </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="runnerModal">
 <div class="modal-box">
  <div class="modal-head">
   <h3><i class="fa-solid fa-code"></i> تجربة الكود داخل المتصفح</h3>
   <button onclick="closeRunner()">✕</button>
  </div>
  <iframe class="runner" id="runner" sandbox="allow-scripts"></iframe>
 </div>
</div>

<script>
/* =========================
   CONFIG
   ضع رابط الـAPI هنا
========================= */
const API_URL = "https://api.rewind.ai/v1/chat/completions";
const MODEL = "openai/gpt-5-nano";

/* =========================
   STATE
========================= */
let selectedFiles = [];
let history = [];

/* =========================
   PARTICLES
========================= */
const canvas=document.getElementById("particles"),ctx=canvas.getContext("2d");
let particles=[];
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener("resize",resizeCanvas);resizeCanvas();
for(let i=0;i<45;i++)particles.push({
 x:Math.random()*innerWidth,y:Math.random()*innerHeight,
 r:Math.random()*1.8+.4,s:Math.random()*.45+.15
});
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(const p of particles){
  p.y-=p.s;if(p.y<0){p.y=canvas.height;p.x=Math.random()*canvas.width}
  ctx.globalAlpha=.35;ctx.fillStyle="#00d9ff";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()
 }
 requestAnimationFrame(animate)
}
animate();

/* =========================
   UI HELPERS
========================= */
function showToast(t){
 const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");
 clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),1800)
}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function resizeInput(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,130)+"px"}
function scrollChat(){requestAnimationFrame(()=>{const c=document.getElementById("chat");c.scrollTop=c.scrollHeight})}
function openSide(){document.getElementById("side").classList.add("show");document.getElementById("sideOverlay").classList.add("show")}
function closeSide(){document.getElementById("side").classList.remove("show");document.getElementById("sideOverlay").classList.remove("show")}

/* =========================
   FILES
========================= */
const textExt=["txt","json","js","jsx","ts","tsx","html","htm","css","scss","md","csv","xml","yaml","yml","py","java","c","cpp","php","sql","sh"];
function isTextFile(f){
 const ext=f.name.split(".").pop().toLowerCase();
 return f.type.startsWith("text/")||textExt.includes(ext)
}
function formatBytes(n){
 if(!n)return"0 B";const u=["B","KB","MB","GB"],i=Math.floor(Math.log(n)/Math.log(1024));
 return (n/Math.pow(1024,i)).toFixed(1)+" "+u[i]
}
function fileToDataURL(file){
 return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})
}
async function compressImage(file){
 if(file.size<700*1024)return file;
 return new Promise(resolve=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   URL.revokeObjectURL(url);
   let w=img.width,h=img.height,max=1600;
   if(w>max){h*=max/w;w=max} if(h>max){w*=max/h;h=max}
   const c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   c.toBlob(b=>resolve(b?new File([b],file.name,{type:"image/jpeg"}):file),"image/jpeg",.82)
  };
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(file)};img.src=url
 })
}
function renderPreview(){
 const p=document.getElementById("preview");p.innerHTML="";
 if(!selectedFiles.length){p.classList.remove("active");return}
 p.classList.add("active");
 selectedFiles.forEach((f,i)=>{
  const item=document.createElement("div");item.className="preview-item";
  const rm=document.createElement("button");rm.className="remove-file";rm.textContent="×";
  rm.onclick=()=>{selectedFiles.splice(i,1);renderPreview()};
  if(f.type.startsWith("image/")){
   const im=document.createElement("img");im.src=URL.createObjectURL(f);item.appendChild(im)
  }else{
   const box=document.createElement("div");box.className="preview-file";box.innerHTML='<i class="fa-solid fa-file"></i>';item.appendChild(box)
  }
  item.appendChild(rm);p.appendChild(item)
 })
}
document.getElementById("fileInput").addEventListener("change",e=>{
 const incoming=[...e.target.files];
 for(const f of incoming){
  if(selectedFiles.length>=8){showToast("الحد الأقصى 8 ملفات");break}
  if(!selectedFiles.some(x=>x.name===f.name&&x.size===f.size))selectedFiles.push(f)
 }
 renderPreview();e.target.value=""
});

/* =========================
   MESSAGE BUILDING
========================= */
async function buildContent(text){
 const content=[];
 if(text)content.push({type:"text",text});
 for(const f of selectedFiles){
  if(f.type.startsWith("image/")){
   showToast("⚡ تجهيز الصورة...");
   const compressed=await compressImage(f);
   const data=await fileToDataURL(compressed);
   content.push({type:"image_url",image_url:{url:data}});
  }else if(isTextFile(f)){
   showToast("📄 قراءة "+f.name);
   const raw=await f.text(),max=120000;
   content.push({type:"text",text:`[ملف مرفق]\nالاسم: ${f.name}\nالحجم: ${formatBytes(f.size)}\n\nالمحتوى:\n${raw.length>max?raw.slice(0,max)+"\n\n[تم اختصار الملف]":raw}`});
  }else{
   content.push({type:"text",text:`[ملف مرفق]\nالاسم: ${f.name}\nالنوع: ${f.type||"غير معروف"}\nالحجم: ${formatBytes(f.size)}\n\nهذا الملف غير النصي يحتاج دعماً من خادم الـAPI لقراءة محتواه.`})
  }
 }
 return content
}

/* =========================
   MESSAGES
========================= */
function addUserMessage(text,files){
 const chat=document.getElementById("chat");
 document.getElementById("welcome")?.remove();
 const msg=document.createElement("div");msg.className="message user";
 const body=document.createElement("div");body.className="message-body";
 const bubble=document.createElement("div");bubble.className="bubble";
 if(text)bubble.innerHTML=escapeHtml(text).replace(/\n/g,"<br>");
 if(files.length){
  const at=document.createElement("div");at.className="attachments";
  files.forEach(f=>{
   const a=document.createElement("div");a.className="attachment";
   if(f.type.startsWith("image/")){
    const im=document.createElement("img");im.src=URL.createObjectURL(f);a.appendChild(im)
   }else a.innerHTML=`<div class="file-box"><i class="fa-solid fa-file"></i><span>${escapeHtml(f.name)}</span></div>`;
   at.appendChild(a)
  });bubble.appendChild(at)
 }
 body.appendChild(bubble);
 const av=document.createElement("div");av.className="avatar";av.innerHTML='<i class="fa-solid fa-user"></i>';
 msg.append(av,body);chat.appendChild(msg);scrollChat()
}
function addLoading(){
 const chat=document.getElementById("chat"),msg=document.createElement("div");msg.className="message";
 const body=document.createElement("div");body.className="message-body";
 const bubble=document.createElement("div");bubble.className="bubble";
 bubble.innerHTML='<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحليل...';
 body.appendChild(bubble);const av=document.createElement("div");av.className="avatar";av.innerHTML='<i class="fa-solid fa-sparkles"></i>';
 msg.append(body,av);chat.appendChild(msg);scrollChat();return bubble
}

/* =========================
   CODE TOOLS
========================= */
function prepareCodeBlocks(root){
 root.querySelectorAll("pre").forEach(pre=>{
  if(pre.querySelector(".code-actions"))return;
  const code=pre.querySelector("code");
  const actions=document.createElement("div");actions.className="code-actions";
  const copy=document.createElement("button");copy.className="code-btn";copy.textContent="نسخ";
  copy.onclick=async()=>{await navigator.clipboard.writeText(code?.innerText||pre.innerText);copy.textContent="تم";setTimeout(()=>copy.textContent="نسخ",1200)};
  actions.appendChild(copy);
  const text=(code?.innerText||pre.innerText||"").trim();
  const lang=(code?.className||"").toLowerCase();
  if(lang.includes("html")||lang.includes("javascript")||lang.includes("js")||lang.includes("css")){
   const run=document.createElement("button");run.className="code-btn";run.textContent="تشغيل";
   run.onclick=()=>runCode(text,lang);actions.appendChild(run)
  }
  pre.appendChild(actions)
 });
 root.querySelectorAll("pre code").forEach(c=>{try{hljs.highlightElement(c)}catch(e){}})
}
function runCode(code,lang){
 let html=code;
 if(lang.includes("javascript")||lang.includes("js")){
  html=`<!doctype html><html><body><script>try{${code}}catch(e){document.body.innerHTML='<pre style="color:red">'+String(e)+'</pre>'}<\/script></body></html>`
 }else if(lang.includes("css")){
  html=`<!doctype html><html><head><style>${code}</style></head><body><h2>ALHWARY AI</h2><p>تجربة CSS</p></body></html>`
 }
 const blob=new Blob([html],{type:"text/html"}),url=URL.createObjectURL(blob);
 document.getElementById("runner").src=url;document.getElementById("runnerModal").classList.add("show")
}
function closeRunner(){document.getElementById("runnerModal").classList.remove("show");document.getElementById("runner").src="about:blank"}

/* =========================
   SEND
========================= */
async function sendMessage(){
 const input=document.getElementById("prompt"),btn=document.getElementById("sendBtn");
 const text=input.value.trim();if(!text&&!selectedFiles.length)return;
 btn.disabled=true;input.disabled=true;
 const files=[...selectedFiles];addUserMessage(text,files);const bubble=addLoading();
 try{
  const content=await buildContent(text);
  const SYSTEM_IDENTITY = `
أنت ALHWARY AI، المساعد الذكي الخاص بمشروع ALHWARY AI.

المطورون الرسميون للمشروع:
- الهواري
- علي ويكا

قواعد الهوية:
