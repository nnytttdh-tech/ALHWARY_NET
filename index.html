<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY VIP</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --alert: #ff3e3e; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: 'Courier New', monospace; color: var(--neon); overflow: hidden; }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }
        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .terminal { background: rgba(0,0,0,0.95); border: 1px solid var(--neon); padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(0,255,65,0.2); text-align: center; border-radius: 5px; }
        .header { font-size: 24px; border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
        .screen { display: none; }
        .active { display: block !important; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; font-weight: bold; cursor: pointer; font-family: inherit; }
        .btn-green { background: var(--neon); color: black; }
        .btn-wa { background: #25d366; color: white; text-decoration: none; display: block; padding: 15px; border-radius: 4px; }
        .id-box { background: rgba(0,255,65,0.05); border: 1px dashed var(--neon); padding: 15px; cursor: pointer; color: #fff; font-size: 14px; margin: 20px 0; }
        .code-item { border: 1px solid var(--neon); margin: 8px 0; padding: 12px; display: flex; justify-content: space-between; background: rgba(0,255,65,0.05); }
        .alert { color: var(--alert); font-weight: bold; }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="container">
    <div class="terminal">
        <div class="header">ALHWARY VIP</div>

        <div id="screen-auth" class="screen active">
            <div style="font-size: 45px; margin-bottom: 15px;">📡</div>
            <p id="auth-msg">جاري فحص تصريح الدخول...</p>
            <button class="btn btn-green" onclick="verifyServer()">دخول النظام</button>
        </div>

        <div id="screen-activation" class="screen">
            <p class="alert">⚠️ الحساب غير مفعل</p>
            <div class="id-box" id="my-id-val" onclick="copyID()">جاري التوليد...</div>
            <p style="font-size: 11px; opacity: 0.8;">إضغط على الكود للنسخ وأرسله للمطور</p>
            <a id="wa-link" href="#" class="btn btn-wa">طلب تفعيل عبر واتساب</a>
        </div>

        <div id="screen-content" class="screen">
            <div style="color:#fff; margin-bottom:15px; border-bottom:1px solid #333;">✅ الأكواد المتاحة لك:</div>
            <div id="codes-list"></div>
        </div>
    </div>
</div>

<script>
    const GITHUB_RAW = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";
    const WA_NUMBER = "201012345678"; 

    function getID() {
        let id = localStorage.getItem('HW_USER_ID');
        if (!id) {
            id = "HW-" + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem('HW_USER_ID', id);
        }
        return id;
    }
    const myID = getID();
    document.getElementById('my-id-val').innerText = myID;
    document.getElementById('wa-link').href = `https://wa.me/${WA_NUMBER}?text=تفعيل_ID:${myID}`;

    async function verifyServer() {
        document.getElementById('auth-msg').innerText = "جاري التحقق...";
        try {
            const res = await fetch(GITHUB_RAW + "?v=" + Date.now());
            const data = await res.json();
            const user = (data.authorized_devices || []).find(d => d.id === myID);
            const today = new Date().toISOString().split('T')[0];

            if (data.site_status === "open") {
                if (user && (user.expire_at === "permanent" || user.expire_at >= today)) {
                    showScreen('screen-content');
                    document.getElementById('codes-list').innerHTML = (data.net_codes || []).map(c => `
                        <div class="code-item">
                            <span>${atob(c.code)}</span>
                            <span>${c.units}U</span>
                        </div>
                    `).join('') || "لا توجد أكواد حالياً.";
                } else {
                    showScreen('screen-activation');
                }
            } else {
                alert("الموقع مغلق للصيانة حالياً.");
            }
        } catch (e) {
            alert("خطأ في الاتصال بالسيرفر.");
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function copyID() {
        navigator.clipboard.writeText(myID);
        alert("تم النسخ ✅");
    }

    // تأثير الماتريكس
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
            if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 45);
</script>
</body>
</html>
