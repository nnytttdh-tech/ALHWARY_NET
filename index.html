<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ALHWARY NET | التفعيل بالـ ID</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; border: 2px solid #25d366; border-radius: 20px; padding: 30px; width: 85%; max-width: 350px; box-shadow: 0 0 15px rgba(37,211,102,0.2); }
        .id-box { font-size: 32px; color: #f5c842; background: #000; padding: 15px; border-radius: 10px; border: 1px dashed #f5c842; margin: 20px 0; font-weight: bold; }
        .btn-wa { background: #25d366; color: #000; text-decoration: none; padding: 12px; border-radius: 8px; display: block; font-weight: bold; margin-top: 10px; }
        .code-item { background: #222; margin: 10px 0; padding: 15px; border-radius: 8px; border-right: 5px solid #25d366; text-align: right; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="loginPage" class="card">
    <h1>ALHWARY <span>NET</span></h1>
    <p>الـ ID الخاص بك هو:</p>
    <div id="myID" class="id-box">...</div>
    <p style="color: #888; font-size: 14px;">أرسل هذا الرقم للمدير لتفعيل دخولك</p>
    <a href="#" id="waLink" class="btn-wa">إرسال الـ ID واتساب</a>
    <p id="status" style="margin-top:15px; color:#aaa;">⏳ في انتظار التفعيل...</p>
</div>

<div id="contentPage" class="card" style="display:none;">
    <h1>🎁 أكواد النت المتاحة</h1>
    <div id="codesContainer"></div>
</div>

<script>
    // 1. توليد ID ثابت للموبايل ده
    let userID = localStorage.getItem('h_user_id') || Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('h_user_id', userID);
    document.getElementById('myID').innerText = userID;

    // 2. رابط الواتساب (حط رقمك هنا)
    document.getElementById('waLink').href = `https://wa.me/201012345678?text=تفعيل ID: ${userID}`;

    // 3. فحص التفعيل من ملف database.json على جيت هاب
    async function checkActivation() {
        try {
            const res = await fetch('database.json?v=' + Math.random());
            const data = await res.json();
            
            // لو الـ ID بتاع الزبون موجود في قائمة المفعولين
            if (data.active_users.includes(userID.toString())) {
                document.getElementById('loginPage').style.display = "none";
                document.getElementById('contentPage').style.display = "block";
                
                let html = "";
                data.net_codes.forEach(item => {
                    html += `<div class="code-item"><span>${item.name}</span><span style="color:#f5c842;">${item.code}</span></div>`;
                });
                document.getElementById('codesContainer').innerHTML = html;
                clearInterval(fحص); // وقف الفحص خلاص دخلنا
            }
        } catch (e) {}
    }

    const fحص = setInterval(checkActivation, 3000); // يفحص كل 3 ثواني
</script>
</body>
</html>
