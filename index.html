<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY_NET | VIP</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* الهيدر الشيك */
        .header {
            width: 100%;
            padding: 20px 0;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border-bottom: 3px solid #ff0000;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; }
        .red-text { color: #ff0000; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }

        /* حاوية الأكواد */
        #code-list {
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column-reverse; /* الجديد يظهر فوق */
            gap: 20px;
        }

        /* تصميم بطاقة الكود (البوكس الشيك) */
        .code-card {
            background: #1a1a1a;
            border-left: 5px solid #ff0000;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease;
            animation: slideIn 0.5s ease-out;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .code-card:hover { transform: scale(1.02); }

        .code-content { display: flex; flex-direction: column; }
        
        .code-value { 
            font-size: 1.4rem; 
            color: #00ff00; /* أخضر فسفوري */
            font-weight: bold; 
            font-family: monospace;
            margin-bottom: 5px;
        }

        .code-label { color: #888; font-size: 0.8rem; text-transform: uppercase; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .loading { color: #ff0000; font-style: italic; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ALHWARY <span class="red-text">NET</span></h1>
    </div>

    <div id="code-list">
        <p class="loading">جاري انتظار الأكواد من البوت...</p>
    </div>

    <script>
        let seenCodes = new Set();

        async function updatePage() {
            try {
                // جلب البيانات من ملف البوت
                const response = await fetch('./codes.json?v=' + Date.now());
                if (!response.ok) return;

                const data = await response.json();
                
                if (data.latest_code) {
                    const codesArray = JSON.parse(data.latest_code);
                    const container = document.getElementById('code-list');

                    codesArray.forEach(item => {
                        if (!seenCodes.has(item.code)) {
                            // إزالة رسالة التحميل أول مرة
                            if (seenCodes.size === 0) container.innerHTML = '';
                            
                            seenCodes.add(item.code);

                            // إنشاء البطاقة الشيك
                            const card = document.createElement('div');
                            card.className = 'code-card';
                            card.innerHTML = `
                                <div class="code-content">
                                    <span class="code-label">كود جديد مستلم</span>
                                    <span class="code-value">${item.code}</span>
                                </div>
                                <div style="color: #444; font-size: 1.2rem;">⚡</div>
                            `;
                            container.appendChild(card);
                        }
                    });
                }
            } catch (e) {
                console.log("Waiting for data...");
            }
        }

        // تحديث كل 5 ثوانٍ
        setInterval(updatePage, 5000);
        updatePage();
    </script>
</body>
</html>
