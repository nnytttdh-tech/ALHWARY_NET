<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL ACCESS | VIP</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --glass-bg: rgba(10, 10, 10, 0.85);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; color: var(--neon-green);
        }

        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: 1; }

        .main-container {
            position: relative; z-index: 2;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .terminal-card {
            background: var(--glass-bg);
            border: 1px solid var(--neon-green);
            padding: 30px; border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            width: 90%; max-width: 450px; text-align: center;
            backdrop-filter: blur(10px);
        }

        .glitch-text { font-size: 24px; font-weight: bold; margin-bottom: 5px; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px var(--neon-green); }
            50% { text-shadow: 0 0 20px var(--neon-green); }
            100% { text-shadow: 0 0 5px var(--neon-green); }
        }

        .status-bar { font-size: 13px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .status-open { color: var(--neon-green); }
        .status-locked { color: #ff3e3e; }

        .id-section {
            background: rgba(0, 0, 0, 0.6); border: 1px dashed var(--neon-green);
            padding: 15px; margin: 20px 0; cursor: pointer; transition: 0.3s;
        }

        .code-box {
            background: #111; border: 1px solid var(--neon-green);
            padding: 10px; margin: 10px 0; font-size: 18px; color: white;
        }

        .btn-action {
            display: block; width: 100%; padding: 12px; margin-top: 10px;
            border: 1px solid var(--neon-green); background: transparent;
            color: var(--neon-green); font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        .btn-action:hover { background: var(--neon-green); color: black; }
        footer { margin-top: 20px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="main-container">
    <div class="terminal-card" id="mainCard">
        <div id="loading">جاري فحص حالة النظام...</div>
    </div>
</div>

<script>
    // --- تأثير الماتريكس (Matrix) ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let i = 0; i < columns; i++) drops[i] = 1;

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff41";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 35);

    // --- الربط مع جيت هاب ---
    const GITHUB_URL = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";

    async function checkSystem() {
        const card = document.getElementById('mainCard');
        try {
            // إضافة طابع زمني لمنع التخزين المؤقت (Cache)
            const response = await fetch(GITHUB_URL + "?t=" + new Date().getTime());
            const data = await response.json();

            if (data.site_status === "open") {
                // لو الموقع مفتوح
                let codesHtml = `<div class="glitch-text">SYSTEM ONLINE</div>
                                 <div class="status-bar status-open">> ACCESS_GRANTED</div>`;
                
                if (data.net_codes.length > 0) {
                    data.net_codes.forEach(item => {
                        const decoded = atob(item.code);
                        codesHtml += `<div class="code-box">${decoded} <br> <small>${item.units} وحدات</small></div>`;
                    });
                } else {
                    codesHtml += `<p>لا توجد أكواد متاحة حالياً.</p>`;
                }
                card.innerHTML = codesHtml + `<footer>ALHWARY VIP TERMINAL</footer>`;
            } else {
                // لو الموقع مقفول (الواجهة الأصلية بتاعتك)
                card.innerHTML = `
                    <div class="glitch-text">SYSTEM RESTRICTED</div>
                    <div class="status-bar status-locked">> STATUS: UNAUTHORIZED</div>
                    <p style="font-size: 14px;">يرجى تفعيل معرف الجهاز للوصول للمميزات</p>
                    <div class="id-section">
                        <span style="font-size: 10px;">DEVICE ID:</span><br>
                        <span style="font-size: 22px;">1FAAD869</span>
                    </div>
                    <button class="btn-action">مراسلة الإدارة</button>
                    <footer>DARK NET SECURITY v4.0.1</footer>
                `;
            }
        } catch (error) {
            card.innerHTML = `<div class="status-locked">خطأ في الاتصال بالسيرفر!</div>`;
        }
    }

    checkSystem();
    // فحص تلقائي كل 30 ثانية
    setInterval(checkSystem, 30000);
</script>
</body>
</html>
