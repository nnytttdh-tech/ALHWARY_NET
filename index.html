<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --r: #c80000; --dark: #070000; --gold: #f5c842; --tx: #f0ecec; }
        body { background: var(--dark); color: var(--tx); font-family: 'Cairo', sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 50px auto; background: #0f0000; padding: 30px; border-radius: 20px; border: 1px solid rgba(200,0,0,0.2); }
        .logo { font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        .logo span { color: var(--r); }
        .display-box { background: #160000; padding: 20px; border-radius: 12px; border: 1px dashed var(--r); margin: 20px 0; font-family: 'Space Mono', monospace; color: var(--gold); word-break: break-all; }
        button { background: linear-gradient(145deg, #e60000, #550000); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-txt { font-size: 12px; color: #9a6060; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">ALHWARY <span>NET</span></div>
    <div class="display-box" id="main-display">جاري التحميل...</div>
    <button id="action-btn" onclick="pullCard()" disabled>سحب كود</button>
    <div class="status-txt" id="status-msg">يرجى الانتظار...</div>
</div>

<script>
    // 🔗 حط IP سيرفرك هنا
    const MY_SERVER_IP = "123.123.123.123"; 
    const API_BASE = `http://${MY_SERVER_IP}:5000`;

    // توليد ID فريد للجهاز
    function getID() {
        let id = localStorage.getItem('h_uid');
        if (!id) {
            id = Math.floor(100 + Math.random() * 899); // ID من 3 أرقام لسهولة النقل
            localStorage.setItem('h_uid', id);
        }
        return id;
    }

    const UID = getID();

    async function checkStatus() {
        const display = document.getElementById('main-display');
        const btn = document.getElementById('action-btn');
        const statusMsg = document.getElementById('status-msg');

        try {
            const res = await fetch(`${API_BASE}/check_status?uid=${UID}`);
            const data = await res.json();

            if (data.status === 'active') {
                display.innerText = "XXXX-XXXX-XXXX-XXXX";
                btn.disabled = false;
                statusMsg.innerText = "حسابك مفعل بنجاح ✅";
            } else {
                display.innerText = `ID: ${UID}`;
                btn.disabled = true;
                statusMsg.innerText = "ابعث الـ ID ده للمدير عشان يفعل لك الحساب";
            }
        } catch (e) {
            display.innerText = "خطأ في الاتصال";
        }
    }

    async function pullCard() {
        const display = document.getElementById('main-display');
        try {
            const res = await fetch(`${API_BASE}/get_card?uid=${UID}`);
            const data = await res.json();
            if (data.status === 'success') {
                display.innerText = data.code;
            } else {
                alert("المخزن فارغ!");
            }
        } catch (e) { alert("حدث خطأ!"); }
    }

    window.onload = checkStatus;
</script>

</body>
</html>
