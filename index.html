
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET</title>
    <style>
        body { 
            background-color: #050510; 
            color: white; 
            font-family: sans-serif; 
            direction: rtl; 
            text-align: center;
            margin: 0; padding: 20px;
        }
        h1 { color: #00d4ff; text-shadow: 0 0 10px #00d4ff; }
        .tab-menu { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .tab-btn { 
            padding: 10px; border: 1px solid #00d4ff; background: none; 
            color: #00d4ff; cursor: pointer; border-radius: 5px;
        }
        .code-box { 
            background: rgba(255,255,255,0.05); border-radius: 10px; 
            padding: 20px; margin-top: 20px; display: none;
        }
        .active { display: block; }
        .code-text { color: #00ffcc; font-weight: bold; font-family: monospace; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <h1>ALHWARY NET</h1>
    <p>دليل أكواد الشركات في مصر</p>

    <div class="tab-menu">
        <button class="tab-btn" onclick="show('v')">فودافون</button>
        <button class="tab-btn" onclick="show('e')">اتصالات</button>
        <button class="tab-btn" onclick="show('o')">أورانج</button>
        <button class="tab-btn" onclick="show('w')">WE</button>
    </div>

    <div id="v" class="code-box active">
        <h3>أكواد فودافون</h3>
        <p>الاحتفاظ بالمكالمات: <span class="code-text">*888*3#</span></p>
        <p>شحن الكارت: <span class="code-text">*888*الرقم#</span></p>
    </div>
    
    <div id="e" class="code-box">
        <h3>أكواد اتصالات</h3>
        <p>الاستعلام عن الرصيد: <span class="code-text">*555#</span></p>
    </div>

    <div id="o" class="code-box">
        <h3>أكواد أورانج</h3>
        <p>معرفة الرقم: <span class="code-text">#119#</span></p>
    </div>

    <div id="w" class="code-box">
        <h3>أكواد وي WE</h3>
        <p>معرفة الرصيد: <span class="code-text">*322#</span></p>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.code-box').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // تفعيلة بسيطة وسريعة للشبكة
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<50; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()-0.5, vy: Math.random()-0.5});
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#00d4ff';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx *= -1;
                if(p.y<0 || p.y>canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
