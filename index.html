<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY_NET | FIXED</title>
    <style>
        :root { --primary: #ff0000; --bg: #050505; }
        body { background-color: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .lock-box { border: 1px solid var(--primary); padding: 30px; border-radius: 20px; width: 80%; max-width: 350px; background: #0d0d0d; }
        .lock-input { width: 100%; padding: 12px; margin: 15px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; text-align: center; font-size: 1.2rem; box-sizing: border-box; }
        .lock-btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .code-item { background: #111; border-right: 5px solid var(--primary); margin: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2 style="color:var(--primary)">SECURITY CHECK</h2>
            <input type="password" id="pass-input" class="lock-input" placeholder="الشفرة">
            <button class="lock-btn" onclick="checkAccess()">دخول</button>
            <p id="err" style="color:red; display:none; margin-top:10px;">خطأ في الشفرة!</p>
        </div>
    </div>

    <h1 style="padding:20px;">ALHWARY <span style="color:var(--primary)">NET</span></h1>
    <div id="code-list"></div>

    <script>
        const TG_TOKEN = "7737242130:AAECXvX_Y37L9XF-P8O76G7S2-K8975G-P0";
        const TG_CHAT_ID = "6102142273";

        function getPass() {
            const h = new Date().getHours();
            return (2026 + h + 2026).toString();
        }

        if (localStorage.getItem('alhwary_auth') === 'granted') {
            document.getElementById('lock-screen').style.display = 'none';
        }

        function checkAccess() {
            const input = document.getElementById('pass-input').value;
            if (input === getPass()) {
                localStorage.setItem('alhwary_auth', 'granted');
                fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("🔥 تم الدخول!")}`);
                document.getElementById('lock-screen').style.display = 'none';
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }

        async function fetchCodes() {
            try {
                const res = await fetch('./codes.json?t=' + Date.now());
                const text = await res.text();
                
                // لو لقيت كلمة الطرد، اخرج فوراً
                if (text.includes("FORCE_LOGOUT")) {
                    localStorage.removeItem('alhwary_auth');
                    location.reload();
                    return;
                }

                const codes = JSON.parse(text);
                const list = document.getElementById('code-list');
                list.innerHTML = "";
                codes.reverse().forEach(item => {
                    list.innerHTML += `<div class="code-item"><div><b>${item.code}</b></div><div style="color:red">${item.units} U</div></div>`;
                });
            } catch (e) {}
        }

        setInterval(fetchCodes, 5000);
        fetchCodes();
    </script>
</body>
</html>
