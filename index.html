<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET</title>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .header { color: #ff3b3b; font-size: 28px; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px; }
        #cardsList { display: flex; flex-direction: column; gap: 15px; max-width: 450px; margin: 0 auto; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; border-bottom: 4px solid #d32f2f; }
        .card-code { color: #fbff00; font-size: 22px; font-weight: bold; margin-bottom: 15px; display: block; text-decoration: none; }
        .card-stats { display: flex; justify-content: space-between; color: #bbb; font-size: 14px; }
        .stat-value { display: block; color: white; font-size: 18px; font-weight: bold; margin-top: 5px; }
        .btn-charge { background-color: #d32f2f; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">ALHWARY NET</div>
    
    <div id="cardsList">جاري تحميل الكروت...</div>

    <script>
        // الرابط الذي استخرجناه من الـ Network
        const targetUrl = 'https://repository-o2oweb.onrender.com/get-cards';

        async function fetchCards() {
            try {
                // استخدام بروكسي بديل لتجنب رسالة "فشل التحديث"
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl) + '&callback=' + Date.now());
                const data = await response.json();
                const apiData = JSON.parse(data.contents);
                const cards = apiData.cards;

                const container = document.getElementById('cardsList');
                container.innerHTML = ''; 

                cards.forEach(card => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="card-code">*858*${card.card_serial}#</div>
                            <div class="card-stats">
                                <div>الوحدات <span class="stat-value">${card.gift_units}</span></div>
                                <div>متبقي <span class="stat-value">${card.remaining_dedications}</span></div>
                            </div>
                            <button class="btn-charge" onclick="window.location.href='tel:*858*${card.card_serial}#'">شحن الكارت</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("خطأ:", error);
                document.getElementById('cardsList').innerHTML = "<p style='color:gray;'>جاري محاولة الاتصال بالسيرفر...</p>";
            }
        }

        // تحديث تلقائي كل 10 ثواني كما في الموقع الأصلي
        setInterval(fetchCards, 10000);
        fetchCards();
    </script>
</body>
</html>
