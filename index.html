<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET | التفعيل بالـ ID</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #0a0a0a; border: 2px solid #25d366; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 0 20px rgba(37,211,102,0.1); }
        h1 { color: #25d366; margin-bottom: 10px; font-size: 24px; }
        h1 span { color: #fff; }
        .id-box { font-size: 35px; color: #f5c842; background: #111; padding: 15px; border-radius: 12px; border: 2px dashed #25d366; margin: 20px 0; font-weight: bold; letter-spacing: 2px; }
        .btn-wa { background: #25d366; color: #000; text-decoration: none; padding: 14px; border-radius: 10px; display: block; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-wa:hover { background: #1ebe57; }
        .status-text { margin-top: 15px; color: #888; font-size: 14px; }
        /* شكل قائمة الأكواد الجديد */
        .code-item { background: #1a1a1a; border: 1px solid #333; border-right: 5px solid #25d366; border-radius: 10px; margin: 10px 0; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .code-name { font-size: 15px; color: #eee; }
        .code-val { color: #f5c842; font-weight: bold; font-size: 18px; font-family: monospace; }
        #contentPage { display: none; }
    </style>
</head>
<body>

<div id="loginPage" class="card">
    <h1>ALHWARY <span>NET</span></h1>
    <p style="color:#ccc;">الـ ID الخاص بك للدخول:</p>
    <div id="myID" class="id-box">...</div>
    <a href="#" id="waLink" class="btn-wa">إرسال الـ ID لتفعيل الحساب</a>
    <p class="status-text">⏳ في انتظار التفعيل من المدير...</p>
</div>

<div id="contentPage" class="card">
    <h1>🎁 أكواد النت المتاحة</h1>
    <div id="codesContainer"></div>
    <button onclick="location.reload()" style="background:#333; color:#fff; border:none; padding:10px; width:100%; border-radius:8px; margin-top:15px; cursor:pointer;">تسجيل خروج</button>
</div>

<script>
    // 1. توليد ID ثابت للموبايل
    let userID = localStorage.getItem('h_user_id') || Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('h_user_id', userID);
    document.getElementById('myID').innerText = userID;

    // 2. رابط الواتساب (تعديل الرقم هنا)
    document.getElementById('waLink').href = `https://wa.me/201556853817?text=يا هواري فعل لي الـ ID ده: ${userID}`;

    // 3. فحص التفعيل السريع
    async function checkActivation() {
        try {
            const res = await fetch('codes.json?t=' + new Date().getTime());
            const data = await res.json();
            
            if (data.active_users.includes(userID.toString())) {
                document.getElementById('loginPage').style.display = "none";
                document.getElementById('contentPage').style.display = "block";
                
                let html = "";
                data.net_codes.forEach(item => {
                    html += `<div class="code-item">
                                <span class="code-name">🎁 كود نت هدية</span>
                                <span class="code-val">${item.code}</span>
                             </div>`;
                });
                document.getElementById('codesContainer').innerHTML = html;
                clearInterval(checkTimer);
            }
        } catch (e) {}
    }

    const checkTimer = setInterval(checkActivation, 2000); // فحص كل ثانيتين
</script>
</body>
</html>
