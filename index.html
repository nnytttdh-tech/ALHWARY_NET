<div id="codes-container">جاري تحميل الأكواد...</div>

<script>
    async function loadCodes() {
        try {
            // بنضيف رقم عشوائي في آخر الرابط عشان نجبر المتصفح يجيب الجديد (تجنب الكاش)
            const response = await fetch('./codes.json?v=' + new Date().getTime());
            const data = await response.json();
            
            const container = document.getElementById('codes-container');
            container.innerHTML = ''; // مسح الرسالة القديمة

            // افترضنا إن ملف الـ JSON عبارة عن قائمة أكواد
            data.forEach(item => {
                const codeElement = document.createElement('p');
                codeElement.textContent = item.code; // تأكد إن كلمة code هي اللي مستخدمها البوت
                container.appendChild(codeElement);
            });
        } catch (error) {
            console.error('خطأ في تحميل الأكواد:', error);
        }
    }

    // تشغيل الدالة أول ما الصفحة تفتح
    loadCodes();
    
    // تحديث الأكواد كل 30 ثانية تلقائياً
    setInterval(loadCodes, 30000);
</script>
