<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY_NET | LIVE SYSTEM</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; }
        .header { width: 100%; padding: 25px 0; background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%); border-bottom: 3px solid #ff0000; text-align: center; margin-bottom: 15px; box-shadow: 0 5px 20px rgba(255,0,0,0.3); }
        .red-text { color: #ff0000; text-shadow: 0 0 15px #ff0000; font-weight: bold; }
        .container { width: 92%; max-width: 500px; }
        
        /* شاشة القفل */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .lock-box { background: #0d0d0d; border: 1px solid #ff0000; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; }
        .lock-input { width: 90%; padding: 12px; margin: 15px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; text-align: center; font-size: 1.2rem; outline: none; }
        .lock-btn { width: 100%; padding: 12px; background: #ff0000; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* العدادات والكروت */
        .stat-item { background: #151515; border: 1px solid #222; border-radius: 12px; flex: 1; padding: 15px; text-align: center; border-bottom: 2px solid #ff0000; margin: 5px; }
        .stat-num { font-size: 1.6rem; font-weight: bold; color: #ff0000; }
        .code-item { background: #1a1a1a; border-right: 5px solid #ff0000; border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .code-val { color: #00ff00; font-weight: bold; font-family: monospace; font-size: 1.4rem; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2 style="color:#ff0000;">SYSTEM RESTRICTED</h2>
            <p style="color:#666;">يرجى إدخال كلمة السر المتغيرة</p>
            <input type="text" id="pass-input" class="lock-input" placeholder="Password">
            <button class="lock-btn" onclick="checkAccess()">دخول النظام</button>
            <p id="err" style="color:red; display:none; margin-top:10px;">كلمة السر غير صحيحة!</p>
        </div>
    </div>

    <div class="header"><h1>ALHWARY <span class="red-text">NET</span></h1></div>
    <div class="container">
        <div style="display:flex;">
            <div class="stat-item"><span style="color:#888;">الزيارات</span><br><span class="stat-num">154</span></div>
            <div class="stat-item"><span style="color:#888;">الكروت</span><br><span class="stat-num" id="total-codes">0</span></div>
        </div>
        <div id="code-list" style="margin-top:20px;"></div>
    </div>

    <script>
        // --- 1. إعدادات التليجرام (حط بياناتك هنا) ---
        const TG_TOKEN = "8118350293:AAGG6fdWTYxB81ajZSFW5IuVKp-zQvaOv6M"; 
        const TG_CHAT_ID = "6979648492";

        // --- 2. معادلة كلمة السر (2026 + الساعة + 2026) ---
        function getHourlyPassword() {
            const hour = new Date().getHours();
            return (2026 + hour + 2026).toString();
        }

        // --- 3. نظام الطرد (Logout) ---
        // لو كتبت كلمة 'logout' في ملف codes.json، الموقع هيطرد الكل تلقائياً
        function checkRemoteLogout(codes) {
            if (JSON.stringify(codes).includes("FORCE_LOGOUT")) {
                localStorage.removeItem('alhwary_auth');
                location.reload();
            }
        }

        // --- 4. إرسال إشعار دخول للتليجرام ---
        function sendNotify() {
            const msg = "✅ دخول جديد ناجح لموقع الهواري نت!";
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(msg)}`);
        }

        // --- 5. فحص الدخول ---
        if (localStorage.getItem('alhwary_auth') === 'granted') {
            document.getElementById('lock-screen').style.display = 'none';
        }

        function checkAccess() {
            const input = document.getElementById('pass-input').value;
            if (input === getHourlyPassword()) {
                localStorage.setItem('alhwary_auth', 'granted');
                sendNotify(); // إرسال رسالة للبوت
                document.getElementById('lock-screen').style.display = 'none';
            } else {
                document.getElementById('err').style.display = 'block';
                setTimeout(() => document.getElementById('err').style.display = 'none', 2000);
            }
        }

        // --- 6. جلب الكروت وتحديث الموقع ---
        let seenCodes = new Set();
        async function fetchCodes() {
            try {
                const res = await fetch('./codes.json?t=' + Date.now());
                const codes = await res.json();
                
                checkRemoteLogout(codes); // فحص لو عايز تطرد حد

                document.getElementById('total-codes').innerText = codes.length;
                const list = document.getElementById('code-list');
                
                codes.reverse().forEach(item => {
                    if (!seenCodes.has(item.code)) {
                        seenCodes.add(item.code);
                        const div = document.createElement('div');
                        div.className = 'code-item';
                        div.innerHTML = `<div><div class="code-val">${item.code}</div><span style="background:#ff0000; padding:2px 8px; border-radius:5px; font-size:0.8rem;">${item.units} وحدة</span></div>`;
                        list.prepend(div);
                    }
                });
            } catch (e) {}
        }

        setInterval(fetchCodes, 10000);
        fetchCodes();
    </script>
</body>
</html>
