<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY VIP | MASTER</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --alert: #ff3e3e; --admin: #00d4ff; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: 'Courier New', monospace; color: var(--neon); overflow: hidden; }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }
        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .terminal { background: rgba(0,0,0,0.95); border: 1px solid var(--neon); padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 0 25px rgba(0,255,65,0.2); text-align: center; border-radius: 5px; }
        .header { font-size: 24px; border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
        .screen { display: none; }
        .active { display: block !important; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; font-weight: bold; cursor: pointer; font-family: inherit; }
        .btn-green { background: var(--neon); color: black; }
        .btn-wa { background: #25d366; color: white; text-decoration: none; display: block; padding: 15px; border-radius: 4px; }
        .id-container { position: relative; margin: 30px 0 15px 0; }
        .admin-btn { position: absolute; top: -22px; left: 0; font-size: 9px; color: #333; cursor: pointer; border: 1px solid #111; padding: 1px 6px; }
        .id-box { background: rgba(0,255,65,0.05); border: 1px dashed var(--neon); padding: 15px; cursor: pointer; color: #fff; font-size: 14px; }
        .admin-panel { text-align: right; color: var(--admin); font-size: 12px; max-height: 380px; overflow-y: auto; padding: 10px; border: 1px solid var(--admin); background: #000; }
        .stat-card { background: rgba(0,212,255,0.05); padding: 10px; margin-bottom: 10px; border-bottom: 1px solid #111; }
        .close-btn { color: var(--alert); float: left; cursor: pointer; font-weight: bold; border: 1px solid var(--alert); padding: 0 5px; }
        .code-item { border: 1px solid var(--neon); margin: 8px 0; padding: 12px; display: flex; justify-content: space-between; background: rgba(0,255,65,0.05); }
        .alert { color: var(--alert); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="container">
    <div class="terminal">
        <div class="header">ALHWARY VIP</div>
        <div id="screen-auth" class="screen active">
            <div style="font-size: 45px; margin-bottom: 15px;">📡</div>
            <p id="auth-msg">بانتظار التحقق من صلاحية الوصول...</p>
            <button class="btn btn-green" onclick="verifyServer()">دخول النظام ⚡</button>
        </div>
        <div id="screen-activation" class="screen">
            <p class="alert">⚠️ ACCESS DENIED / غير مفعل</p>
            <div class="id-container">
                <div class="admin-btn" onclick="openAdminRoom()">[ الغرفة السرية ]</div>
                <div class="id-box" id="my-id-val" onclick="copyID()">جاري التوليد...</div>
            </div>
            <a id="wa-link" href="#" class="btn btn-wa">طلب تفعيل VIP</a>
        </div>
        <div id="screen-admin" class="screen">
            <div class="admin-panel">
                <span class="close-btn" onclick="showScreen('screen-activation')">X</span>
                <h4 style="margin:0 0 10px 0;">🔐 لوحة التحكم</h4>
                <div id="admin-data">جاري جلب البيانات...</div>
            </div>
        </div>
        <div id="screen-content" class="screen">
            <div style="color:#fff; margin-bottom:15px; border-bottom:1px solid #333;">✅ الأكواد النشطة:</div>
            <div id="codes-list"></div>
        </div>
    </div>
</div>

<script>
    const GITHUB_RAW = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";
    const WA_NUMBER = "201012345678"; 

    // --- الـ ID الخاص بك المعتمد ---
    const OWNER_ID = "HW-BDIJ26DM4"; 

    // بصمة كلمة السر (20112011)
    const PASS_HASH = "80f55e054457788448833985b9b872b257521a070e7e1329241910609b552718";

    function getID() {
        let id = localStorage.getItem('HW_VFINAL_FIXED');
        if (!id) {
            id = OWNER_ID; // تعيين الـ ID الخاص بك تلقائياً إذا كنت أنت المستخدم
            localStorage.setItem('HW_VFINAL_FIXED', id);
        }
        return id;
    }
    const myID = getID();
    document.getElementById('my-id-val').innerText = myID;
    document.getElementById('wa-link').href = `https://wa.me/${WA_NUMBER}?text=تفعيل_ID:${myID}`;

    async function openAdminRoom() {
        // حماية الـ ID
        if (myID !== OWNER_ID) {
            alert("❌ جهازك غير مسجل كأدمن!");
            return;
        }

        let pass = prompt("أدخل كلمة المرور:");
        if (!pass) return;

        const encoded = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass));
        const hashHex = Array.from(new Uint8Array(encoded)).map(b => b.toString(16).padStart(2, '0')).join('');

        if (hashHex === PASS_HASH) {
            showScreen('screen-admin');
            loadAdminStats();
        } else {
            alert("⚠️ كلمة المرور غلط!");
        }
    }

    async function loadAdminStats() {
        const display = document.getElementById('admin-data');
        try {
            const res = await fetch(GITHUB_RAW + "?v=" + Date.now());
            const data = await res.json();
            display.innerHTML = `
                <div class="stat-card"><b>📊 إحصائيات:</b> المشتركين: ${data.authorized_devices.length} | الأكواد: ${data.net_codes.length}</div>
                <div class="stat-card"><b>👥 المشتركين:</b><br>${data.authorized_devices.map(u => `• ${u.id} (${u.expire_at})`).join('<br>')}</div>
                <div class="stat-card"><b>🔑 الأكواد المرفوعة:</b><br>${data.net_codes.map(c => `• ${atob(c.code)} [${c.units}U]`).join('<br>')}</div>
            `;
        } catch(e) { display.innerText = "خطأ في الاتصال بالسيرفر."; }
    }

    async function verifyServer() {
        document.getElementById('auth-msg').innerText = "جاري الفحص...";
        try {
            const res = await fetch(GITHUB_RAW + "?v=" + Date.now());
            const data = await res.json();
            const user = (data.authorized_devices || []).find(d => d.id === myID);
            const today = new Date().toISOString().split('T')[0];

            if (data.site_status === "open") {
                if (user && (user.expire_at === "permanent" || user.expire_at >= today)) {
                    showScreen('screen-content');
                    document.getElementById('codes-list').innerHTML = (data.net_codes || []).map(c => `<div class="code-item"><span>${atob(c.code)}</span><span>${c.units}U</span></div>`).join('');
                } else { showScreen('screen-activation'); }
            } else { alert("الموقع مغلق للصيانة."); }
        } catch (e) { alert("خطأ اتصال."); }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function copyID() { navigator.clipboard.writeText(myID); alert("تم النسخ ✅"); }

    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
            if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 45);
</script>
</body>
</html>
