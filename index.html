<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY_NET | PREMIUM SYSTEM</title>
    <style>
        :root { --primary: #ff0000; --bg: #050505; --card-bg: rgba(20, 20, 20, 0.8); }
        body { background-color: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* تأثيرات الخلفية */
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 120%; height: 120%; background: radial-gradient(circle at center, #200000 0%, transparent 70%); z-index: -1; }

        .header { padding: 40px 0; text-align: center; letter-spacing: 2px; }
        .header h1 { font-size: 2.5rem; margin: 0; font-weight: 900; text-transform: uppercase; }
        .red-glow { color: var(--primary); text-shadow: 0 0 20px var(--primary); }

        .container { width: 90%; max-width: 450px; margin: 0 auto; }

        /* شاشة القفل العصرية */
        #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .lock-box { background: var(--card-bg); border: 1px solid rgba(255,0,0,0.2); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 85%; }
        
        .lock-input { width: 100%; padding: 15px; margin: 20px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; border-radius: 12px; text-align: center; font-size: 1.2rem; transition: 0.3s; box-sizing: border-box; }
        .lock-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(255,0,0,0.3); outline: none; }
        
        .lock-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .lock-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--primary); }

        /* الكروت العصرية */
        .stat-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 25px; backdrop-filter: blur(5px); }
        .stat-num { font-size: 2rem; color: var(--primary); font-weight: bold; display: block; }

        .code-item { 
            background: linear-gradient(135deg, rgba(30,30,30,0.6) 0%, rgba(10,10,10,0.8) 100%);
            border-left: 4px solid var(--primary);
            margin-bottom: 15px; padding: 20px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center;
            animation: slideUp 0.5s ease forwards; opacity: 0;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .code-val { font-family: 'Courier New', monospace; color: #00ff88; font-size: 1.5rem; font-weight: bold; }
        .units-badge { background: rgba(255,0,0,0.15); color: var(--primary); padding: 4px 12px; border-radius: 8px; font-size: 0.8rem; border: 1px solid rgba(255,0,0,0.2); }

        footer { text-align: center; padding: 30px; color: #444; font-size: 0.8rem; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2 class="red-glow">SECURITY CHECK</h2>
            <p style="color: #888;">أدخل شفرة العبور للوصول للنظام</p>
            <input type="password" id="pass-input" class="lock-input" placeholder="••••">
            <button class="lock-btn" onclick="checkAccess()">التحقق من الهوية</button>
            <p id="err" style="color:var(--primary); display:none; margin-top:15px; font-size:0.9rem;">شفرة خاطئة! جرب مرة أخرى</p>
        </div>
    </div>

    <div class="header">
        <h1>ALHWARY <span class="red-glow">NET</span></h1>
    </div>

    <div class="container">
        <div class="stat-card">
            <span style="color:#888; text-transform:uppercase; font-size:0.7rem; letter-spacing:2px;">الكروت النشطة الآن</span>
            <span class="stat-num" id="total-codes">0</span>
        </div>

        <div id="code-list">
            </div>
    </div>

    <footer>BY ALHWARY SYSTEM &copy; 2026</footer>

    <script>
        // إعدادات البوت والمعادلة
        const TG_TOKEN = "YOUR_BOT_TOKEN";
        const TG_CHAT_ID = "YOUR_CHAT_ID";

        function getHourlyPassword() {
            const hour = new Date().getHours();
            return (2026 + hour + 2026).toString();
        }

        if (localStorage.getItem('alhwary_auth') === 'granted') {
            document.getElementById('lock-screen').style.display = 'none';
        }

        function checkAccess() {
            const input = document.getElementById('pass-input').value;
            if (input === getHourlyPassword()) {
                localStorage.setItem('alhwary_auth', 'granted');
                // إرسال إشعار
                fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("🔥 دخول جديد للموقع!")}`);
                document.getElementById('lock-screen').style.display = 'none';
            } else {
                document.getElementById('err').style.display = 'block';
                setTimeout(() => document.getElementById('err').style.display = 'none', 2000);
            }
        }

        let seenCodes = new Set();
        async function fetchCodes() {
            try {
                const res = await fetch('./codes.json?t=' + Date.now());
                const codes = await res.json();
                
                // ميزة الطرد
                if (JSON.stringify(codes).includes("FORCE_LOGOUT")) {
                    localStorage.removeItem('alhwary_auth');
                    location.reload();
                }

                document.getElementById('total-codes').innerText = codes.length;
                const list = document.getElementById('code-list');
                
                codes.reverse().forEach((item, index) => {
                    if (!seenCodes.has(item.code)) {
                        seenCodes.add(item.code);
                        const div = document.createElement('div');
                        div.className = 'code-item';
                        div.style.animationDelay = (index * 0.1) + 's';
                        div.innerHTML = `
                            <div>
                                <div class="code-val">${item.code}</div>
                                <span class="units-badge">${item.units} UNIT</span>
                            </div>
                            <div style="color:var(--primary); font-size:1.5rem;">⚡</div>
                        `;
                        list.prepend(div);
                    }
                });
            } catch (e) {}
        }

        setInterval(fetchCodes, 10000);
        fetchCodes();
    </script>
</body>
</html>
