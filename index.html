<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY VIP | BIOMETRIC ACCESS</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --alert: #ff3e3e; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: 'Courier New', monospace; overflow: hidden; color: var(--neon); }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }
        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .terminal { background: rgba(0,0,0,0.95); border: 1px solid var(--neon); padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 0 20px rgba(0,255,65,0.2); text-align: center; }
        .header { font-size: 24px; border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px; }
        
        /* شاشات الواجهة */
        #auth-screen, #activation-screen, #content-screen { display: none; }
        .active { display: block !important; }

        /* الأزرار */
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .btn-green { background: var(--neon); color: black; }
        .btn-outline { background: transparent; color: var(--neon); border: 1px solid var(--neon); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; border-radius: 4px; }

        .id-box { background: rgba(0,255,65,0.05); border: 1px dashed var(--neon); padding: 15px; margin: 15px 0; cursor: pointer; word-break: break-all; color: #fff; }
        .code-item { border: 1px solid var(--neon); margin: 10px 0; padding: 15px; background: rgba(0,255,65,0.05); display: flex; justify-content: space-between; align-items: center; text-align: right; }
        
        .status-msg { font-size: 14px; margin: 15px 0; color: #888; }
        .alert { color: var(--alert); font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="terminal">
        <div class="header">ALHWARY VIP □</div>

        <div id="auth-screen" class="active">
            <div id="icon" style="font-size: 50px; margin-bottom: 20px;">🛡️</div>
            <p class="status-msg" id="msg">نظام حماية VIP.. اختر وسيلة الدخول</p>
            <button id="btn-bio" class="btn btn-green" onclick="useBiometric()">بصمة الإصبع / الوجه 👤</button>
            <button class="btn btn-outline" onclick="verifyDirectly()">دخول عادي بالـ ID 🔑</button>
        </div>

        <div id="activation-screen">
            <p class="alert">ACCESS DENIED / غير مفعل</p>
            <p style="font-size: 12px;">أرسل المعرف الخاص بك للمطور للتفعيل:</p>
            <div class="id-box" id="display-id" onclick="copyID()">جاري التوليد...</div>
            <a id="wa-link" href="#" class="btn btn-wa">تفعيل عبر واتساب</a>
        </div>

        <div id="content-screen">
            <div style="color: #fff; margin-bottom: 15px; border-bottom: 1px solid #333;">✅ مرحباً بك في النظام النشط</div>
            <div id="codes-list"></div>
        </div>

        <div style="font-size: 10px; margin-top: 30px; opacity: 0.5;">SERVER STATUS: <span id="ping">0</span>ms</div>
    </div>
</div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";
    const ADMIN_WA = "201012345678"; // رقمك هنا

    // --- توليد وتثبيت ID الجهاز ---
    function getID() {
        let id = localStorage.getItem('DEVICE_SECRET_ID');
        if (!id) {
            id = "HW-" + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem('DEVICE_SECRET_ID', id);
        }
        return id;
    }
    const myID = getID();
    document.getElementById('display-id').innerText = myID;
    document.getElementById('wa-link').href = `https://wa.me/${ADMIN_WA}?text=تفعيل_ID:${myID}`;

    // إخفاء زر البصمة لو الجهاز مبيعرفش يشغلها
    if (!window.PublicKeyCredential) {
        document.getElementById('btn-bio').style.display = 'none';
        document.getElementById('msg').innerText = "جهازك لا يدعم البصمة، ادخل بالـ ID";
    }

    // --- وظيفة البصمة / الوجه ---
    async function useBiometric() {
        try {
            document.getElementById('msg').innerText = "جاري التحقق من الهوية...";
            // طلب نافذة بصمة الهاتف الفعلية
            await navigator.credentials.get({
                publicKey: { challenge: new Uint8Array([1,2,3,4]), userVerification: "required" }
            });
            // لو نجحت البصمة، كمل فحص السيرفر
            verifyDirectly();
        } catch (e) {
            document.getElementById('msg').innerText = "تم إلغاء البصمة، يمكنك الدخول عادي";
        }
    }

    // --- الفحص النهائي من السيرفر ---
    async function verifyDirectly() {
        const start = performance.now();
        document.getElementById('msg').innerText = "جارِ فحص الصلاحية في السيرفر...";

        try {
            const res = await fetch(GITHUB_URL + "?v=" + Date.now());
            const data = await res.json();
            document.getElementById('ping').innerText = Math.floor(performance.now() - start);

            const user = (data.authorized_devices || []).find(d => d.id === myID);
            const today = new Date().toISOString().split('T')[0];

            if (data.site_status === "open") {
                if (user && (user.expire_at === "permanent" || user.expire_at >= today)) {
                    // نجاح الدخول
                    switchScreen('content-screen');
                    let html = "";
                    (data.net_codes || []).forEach(c => {
                        html += `<div class="code-item">
                            <span>${atob(c.code)}</span>
                            <span style="color:#888; font-size:12px;">${c.units}U</span>
                        </div>`;
                    });
                    document.getElementById('codes-list').innerHTML = html || "لا توجد أكواد حالياً";
                } else {
                    // فشل الصلاحية أو انتهاء الوقت
                    switchScreen('activation-screen');
                    if (user && user.expire_at < today) {
                        document.querySelector('.alert').innerText = "انتهى وقت اشتراكك: " + user.expire_at;
                    }
                }
            } else {
                document.getElementById('msg').innerHTML = "<span class='alert'>النظام مغلق للصيانة 🛠️</span>";
            }
        } catch (e) {
            document.getElementById('msg').innerHTML = "<span class='alert'>خطأ في الاتصال بالسيرفر!</span>";
        }
    }

    function switchScreen(id) {
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('activation-screen').classList.remove('active');
        document.getElementById('content-screen').classList.remove('active');
        document.getElementById(id).classList.add('active');
    }

    function copyID() {
        navigator.clipboard.writeText(myID);
        alert("تم نسخ الـ ID بنجاح ✅");
    }

    // --- خلفية الماتريكس ---
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
            if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 45);
</script>
</body>
</html>
