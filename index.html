<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET</title>
    <style>
        body { background: #050000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #0a0a0a; border: 2px solid #25d366; border-radius: 20px; padding: 30px; text-align: center; width: 85%; box-shadow: 0 0 20px rgba(37, 211, 102, 0.4); }
        h1 { color: #25d366; margin: 0; font-size: 28px; text-shadow: 0 0 10px #25d366; }
        .id-box { background: #000; border: 1px dashed #f5c842; padding: 20px; border-radius: 10px; font-size: 32px; color: #f5c842; margin: 20px 0; font-weight: bold; }
        .btn { background: linear-gradient(45deg, #25d366, #128c7e); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; display: block; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ALHWARY <span>NET</span></h1>
        <p>انسخ الـ ID واضغط للإرسال للمدير</p>
        
        <div class="id-box" id="user_id">...</div>
        
        <button class="btn" onclick="goToWhatsApp()">إرسال الـ ID عبر واتساب</button>
    </div>

    <script>
        // 1. توليد الـ ID فوراً وحفظه في الجهاز
        let savedID = localStorage.getItem('alhwary_id');
        if (!savedID) {
            savedID = Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('alhwary_id', savedID);
        }
        document.getElementById('user_id').innerText = savedID;

        // 2. وظيفة فتح الواتساب (ضع رقمك مكان 201012345678)
        function goToWhatsApp() {
            const myPhone = "201556853817"; // رقمك بالصيغة الدولية
            const message = "يا مدير، ده الـ ID بتاعي وعايز كود التفعيل: " + savedID;
            window.location.href = "whatsapp://send?phone=" + myPhone + "&text=" + encodeURIComponent(message);
        }
    </script>
</body>
</html>
