<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY NET</title>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .header { color: #ff3131; font-size: 30px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        #cardsList { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; border-bottom: 4px solid #ff3131; }
        .card-code { color: #fbff00; font-size: 24px; font-weight: bold; margin-bottom: 10px; display: block; }
        .card-stats { display: flex; justify-content: space-between; color: #bbb; font-size: 14px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .stat-value { display: block; color: white; font-size: 18px; font-weight: bold; }
        .btn-charge { background-color: #ff3131; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .loading-text { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">ALHWARY NET</div>
    
    <div id="cardsList" class="loading-text">جاري محاولة الاتصال بالسيرفر...</div>

    <script>
        // رابط المصدر اللي طلعناه من الـ Network
        const targetUrl = 'https://repository-o2oweb.onrender.com/get-cards';

        async function fetchCards() {
            const container = document.getElementById('cardsList');
            
            // بنجرب 3 بروكسيات مختلفة عشان نضمن الوصول
            const proxies = [
                'https://api.allorigins.win/get?url=',
                'https://corsproxy.io/?',
                'https://thingproxy.freeboard.io/fetch/'
            ];

            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy + encodeURIComponent(targetUrl) + (proxy.includes('allorigins') ? '&cache=' + Date.now() : ''));
                    
                    let data;
                    if (proxy.includes('allorigins')) {
                        const json = await response.json();
                        data = JSON.parse(json.contents);
                    } else {
                        data = await response.json();
                    }

                    if (data && data.cards) {
                        renderCards(data.cards);
                        return; // لو نجحنا نخرج من المحاولات
                    }
                } catch (e) {
                    console.log("فشل البروكسي، بنجرب اللي بعده...");
                }
            }
            container.innerHTML = "عفواً، السيرفر الأصلي لا يستجيب حالياً. سأحاول مجدداً خلال ثوانٍ.";
        }

        function renderCards(cards) {
            const container = document.getElementById('cardsList');
            container.innerHTML = ''; 
            cards.forEach(card => {
                container.innerHTML += `
                    <div class="card">
                        <span class="card-code">*858*${card.card_serial}#</span>
                        <div class="card-stats">
                            <div>الوحدات <span class="stat-value">${card.gift_units}</span></div>
                            <div>متبقي <span class="stat-value">${card.remaining_dedications}</span></div>
                        </div>
                        <button class="btn-charge" onclick="window.location.href='tel:*858*${card.card_serial}#'">شحن الآن</button>
                    </div>
                `;
            });
        }

        // تحديث كل 10 ثواني كما في الملفات المرفقة
        setInterval(fetchCards, 10000);
        fetchCards();
    </script>
</body>
</html>
