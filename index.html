<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY_NET | LIVE SYSTEM</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; }
        .header { width: 100%; padding: 25px 0; background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%); border-bottom: 3px solid #ff0000; text-align: center; margin-bottom: 15px; box-shadow: 0 5px 20px rgba(255,0,0,0.3); }
        .red-text { color: #ff0000; text-shadow: 0 0 15px #ff0000; font-weight: bold; }
        .container { width: 92%; max-width: 500px; }
        .stats { display: flex; gap: 12px; margin-bottom: 20px; }
        .stat-item { background: #151515; border: 1px solid #222; border-radius: 12px; flex: 1; padding: 15px; text-align: center; border-bottom: 2px solid #ff0000; }
        .stat-num { font-size: 1.6rem; font-weight: bold; color: #ff0000; display: block; }
        .section-title { font-size: 1rem; color: #888; margin: 20px 0 10px; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; justify-content: space-between; }
        .card { background: #151515; border: 1px solid #222; border-radius: 15px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .code-item { background: #1a1a1a; border-right: 5px solid #ff0000; border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom:10px; }
        .code-val { color: #00ff00; font-weight: bold; font-family: monospace; font-size: 1.4rem; }
        
        /* شاشة القفل */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .lock-box { background: #0d0d0d; border: 1px solid #ff0000; padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 350px; }
