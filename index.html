<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهواري نت | ALHWARY NET VIP</title>
    <style>
        :root {
            --neon-blue: #00f2fe;
            --dark-bg: #000000;
            --card-bg: rgba(10, 10, 10, 0.9);
            --text-color: #ccc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            -webkit-user-select: none; 
            user-select: none; 
            background-color: var(--dark-bg); 
            color: var(--text-color); 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
        }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .overlay { 
            position: relative; z-index: 2; height: 100vh; overflow-y: auto; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; background: rgba(0, 0, 0, 0.6); 
        }
        .code-card { 
            background: var(--card-bg); border: 1px solid #222; 
            border-top: 3px solid var(--neon-blue); margin-bottom: 20px; 
            padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; 
        }
        .btn { 
            background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); 
            padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; 
            cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .ascii-logo { color: var(--neon-blue); font-size: 8px; white-space: pre; text-align: center; margin-bottom: 15px; }
        .id-box { font-size: 28px; color: #f1c40f; border: 2px dashed #444; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body oncontextmenu="return false;">

<canvas id="matrixCanvas"></canvas>

<div class="overlay">
    <div id="loginPage" style="text-align:center; margin-top:15%;">
        <div class="ascii-logo">
      _    _      _    ___        ___    ____ __   __
     / \  | |    | |  | \ \      / / \  |  _ \\ \ / /
    / _ \ | |    | |__| |\ \ /\ / / _ \ | |_) |\ V / 
   / ___ \| |___ |  __  | \ V  V / ___ \|  _ <  | |  
  /_/   \_\_____||_|  |_|  \_/\_/_/   \_\_| \_\ |_|  
        </div>
        <h1 style="color:var(--neon-blue);">ALHWARY NET VIP</h1>
        <div class="id-box" id="myID">------</div>
        <button class="btn" id="activeBtn">إرسال طلب تفعيل للبوت الجديد</button>
    </div>

    <div id="contentPage" style="display:none; width: 100%; text-align: center;">
        <h2 style="color:var(--neon-blue); margin-bottom:20px;">SYSTEM_ONLINE</h2>
        <div id="codesContainer"></div>
    </div>
</div>

<script>
    // --- البيانات المحدثة ---
    const BOT_TOKEN = '8118350293:AAGG6fdWTYxB81ajZSFW5IuVKp-zQvaOv6M'; // التوكن الجديد
    const ADMIN_ID = '6979648492';
    const G_TOKEN = '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';
    const REPO = 'nnytttdh-tech/ALHWARY_NET';
    const FILE = 'codes.json';

    let userId = localStorage.getItem('h_user_id') || Math.floor(100000 + Math.random() * 900000).toString();
    localStorage.setItem('h_user_id', userId);
    document.getElementById('myID').innerText = userId;

    async function sendTelegram(msg) {
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: ADMIN_ID, text: msg })
            });
        } catch (e) { console.error("Error Telegram"); }
    }

    document.getElementById('activeBtn').onclick = async () => {
        await sendTelegram(`🔔 طلب تفعيل جديد على البوت المحدث!\n👤 ID المستخدم: ${userId}`);
        alert('تم إرسال الـ ID بنجاح!');
    };

    async function checkAuth() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}?v=${Date.now()}`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            if (res.status === 200) {
                const data = await res.json();
                const content = JSON.parse(atob(data.content));
                if (content.site_status === "open" || (content.active_users && content.active_users[userId])) {
                    document.getElementById('loginPage').style.display = "none";
                    document.getElementById('contentPage').style.display = "block";
                    render(content);
                }
            }
        } catch(e) {}
    }

    function render(data) {
        let h = "";
        data.net_codes.forEach(c => {
            const code = atob(c.code);
            h += `<div class="code-card">
                <p>الكود: <b>${code}</b></p>
                <p>الوحدات: <b style="color:var(--neon-blue);">${c.units}</b></p>
                <button class="btn" onclick="claim('${code}')">نسخ واستلام</button>
            </div>`;
        });
        document.getElementById('codesContainer').innerHTML = h;
    }

    async function claim(code) {
        navigator.clipboard.writeText(code);
        alert('تم النسخ!');
        await sendTelegram(`✅ تم سحب كود من الموقع!\n👤 ID: ${userId}\n🎫 الكود: ${code}`);
    }

    // تأثير الماتريكس
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width / 16)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00f2fe"; ctx.font = "16px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
            if (y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 35);
    setInterval(checkAuth, 10000);
    checkAuth();
</script>
</body>
</html>
