<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHWARY VIP | BIOMETRIC SYSTEM</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --alert: #ff3e3e; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: 'Courier New', monospace; overflow: hidden; color: var(--neon); }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }
        .container { position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .terminal { background: rgba(0,0,0,0.95); border: 1px solid var(--neon); padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 0 30px rgba(0,255,65,0.2); text-align: center; border-radius: 5px; }
        .header { font-size: 24px; border-bottom: 1px solid var(--neon); padding-bottom: 15px; margin-bottom: 25px; letter-spacing: 4px; font-weight: bold; }
        
        /* واجهة القفل */
        .lock-screen { display: block; }
        .icon-shield { font-size: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon)); }
        .btn-bio { background: var(--neon); color: black; border: none; padding: 18px; width: 100%; font-weight: bold; cursor: pointer; font-size: 18px; border-radius: 4px; transition: 0.3s; margin-top: 15px; }
        .btn-bio:hover { background: #fff; transform: scale(1.02); }
        
        /* واجهة التفعيل */
        .activation-screen { display: none; margin-top: 20px; }
        .id-box { background: rgba(0,255,65,0.1); border: 1px dashed var(--neon); padding: 15px; margin: 15px 0; font-size: 16px; cursor: pointer; word-break: break-all; color: #fff; }
        .btn-whatsapp { display: block; width: 100%; padding: 15px; background: #25d366; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        
        /* واجهة المحتوى (الأكواد) */
        .content-screen { display: none; text-align: right; max-height: 400px; overflow-y: auto; }
        .code-item { border: 1px solid var(--neon); margin: 10px 0; padding: 15px; background: rgba(0,255,65,0.05); display: flex; justify-content: space-between; align-items: center; }
        .units { color: #888; font-size: 12px; }

        .status-msg { font-size: 14px; margin: 15px 0; min-height: 20px; }
        .alert { color: var(--alert); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .footer-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; margin-top: 30px; border-top: 1px solid #333; padding-top: 10px; opacity: 0.6; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="terminal">
        <div class="header">ALHWARY SYSTEM</div>

        <div id="screen-lock" class="lock-screen">
            <div class="icon-shield">🛡️</div>
            <div class="status-msg" id="lock-msg">نظام مشفر.. بانتظار البصمة</div>
            <button class="btn-bio" onclick="startBiometric()">فتح بالبصمة / الوجه</button>
        </div>

        <div id="screen-activation" class="activation-screen">
            <p style="color: var(--alert);">⚠️ الوصول مرفوض / غير مفعل</p>
            <p style="font-size: 13px;">أرسل المعرف الخاص بك للمطور لتفعيل VIP:</p>
            <div class="id-box" id="my-id-display" onclick="copyID()">جاري التوليد..</div>
            <a id="whatsapp-link" href="#" class="btn-whatsapp">تفعيل عبر واتساب</a>
        </div>

        <div id="screen-content" class="content-screen">
            <div style="color: #fff; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px;">✅ تم التحقق: مرحباً بك في VIP</div>
            <div id="codes-container"></div>
        </div>

        <div class="footer-stats">
            <div>PING: <span id="ping-val">0</span>ms</div>
            <div>STATUS: <span id="conn-val">ONLINE</span></div>
        </div>
    </div>
</div>

<script>
    // --- الإعدادات الرئيسية ---
    const GITHUB_JSON = "https://raw.githubusercontent.com/nnytttdh-tech/ALHWARY_NET/main/codes.json";
    const ADMIN_WA = "201012345678"; // ضع رقمك هنا

    // --- 1. توليد وتثبيت الـ ID ---
    function getID() {
        let id = localStorage.getItem('ALHWARY_ID');
        if (!id) {
            id = "HW-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem('ALHWARY_ID', id);
        }
        return id;
    }
    const USER_ID = getID();
    document.getElementById('my-id-display').innerText = USER_ID;
    document.getElementById('whatsapp-link').href = `https://wa.me/${ADMIN_WA}?text=تفعيل_ID:${USER_ID}`;

    // --- 2. وظيفة البصمة ---
    async function startBiometric() {
        const msg = document.getElementById('lock-msg');
        
        // التحقق من دعم البصمة في الجهاز
        if (window.PublicKeyCredential) {
            try {
                msg.innerText = "🔍 جاري فحص البصمة...";
                // طلب استجابة من مستشعر البصمة في الهاتف
                // ملاحظة: المتصفح سيفتح نافذة البصمة/الوجه الرسمية للجهاز
                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: new Uint8Array([1,2,3,4]),
                        allowCredentials: [],
                        userVerification: "required"
                    }
                }).catch(() => {
                    // لو البصمة مفعلة بس الجهاز ملوش ملفات تعريف هيعدي كـ "تأكيد هوية"
                    console.log("Biometric prompt skipped or handled by OS");
                });

                // بعد تجاوز خطوة البصمة.. نفحص السيرفر
                fetchAndVerify();
            } catch (err) {
                msg.innerHTML = "<span class='alert'>فشل التحقق من الهوية</span>";
            }
        } else {
            // لو المتصفح قديم مش بيدعم بصمة هيفتح بالـ ID عادي
            fetchAndVerify();
        }
    }

    // --- 3. الفحص من السيرفر (الموافقة + الوقت) ---
    async function fetchAndVerify() {
        const t1 = performance.now();
        const lockScreen = document.getElementById('screen-lock');
        const actScreen = document.getElementById('screen-activation');
        const contentScreen = document.getElementById('screen-content');
        const msg = document.getElementById('lock-msg');

        try {
            const response = await fetch(GITHUB_JSON + "?cache=" + Date.now());
            const data = await response.json();
            document.getElementById('ping-val').innerText = Math.floor(performance.now() - t1);

            const today = new Date().toISOString().split('T')[0];
            const user = (data.authorized_devices || []).find(d => d.id === USER_ID);

            if (data.site_status === "open") {
                if (user && (user.expire_at === "permanent" || user.expire_at >= today)) {
                    // نجاح الدخول (موجود في السيرفر ووقتك مخلصش)
                    lockScreen.style.display = "none";
                    actScreen.style.display = "none";
                    contentScreen.style.display = "block";
                    
                    let codesHTML = "";
                    (data.net_codes || []).forEach(c => {
                        codesHTML += `<div class="code-item">
                            <span>${atob(c.code)}</span>
                            <span class="units">${c.units} UNITS</span>
                        </div>`;
                    });
                    document.getElementById('codes-container').innerHTML = codesHTML || "لا توجد أكواد حالياً";
                } else if (user && user.expire_at < today) {
                    // الوقت خلص
                    msg.innerHTML = "<span class='alert'>❌ انتهت صلاحية اشتراكك!</span>";
                    setTimeout(() => {
                        lockScreen.style.display = "none";
                        actScreen.style.display = "block";
                        document.getElementById('whatsapp-link').innerText = "تجديد الاشتراك الآن";
                    }, 2000);
                } else {
                    // لسه موافقتش عليه من عندك
                    lockScreen.style.display = "none";
                    actScreen.style.display = "block";
                }
            } else {
                msg.innerHTML = "<span class='alert'>الموقع مغلق للصيانة</span>";
            }
        } catch (e) {
            msg.innerHTML = "<span class='alert'>خطأ في الاتصال بالسيرفر</span>";
        }
    }

    function copyID() {
        navigator.clipboard.writeText(USER_ID);
        alert("تم نسخ معرف الجهاز بنجاح");
    }

    // --- تأثير الماتريكس الخلفي ---
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(Math.floor(Math.random()*2), i*14, y*14);
            if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 40);
</script>
</body>
</html>
